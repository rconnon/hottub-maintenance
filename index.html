<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Joel's Hot Tub Water Manager</title>
<style>
/* ============================================================
   CSS VARIABLES — light mode is the default; dark overrides
   via prefers-color-scheme. System fonts only, no CDN.
   ============================================================ */
:root {
  color-scheme: light dark;
  --bg: #f9f9f7;            /* page plane */
  --surface: #fcfcfb;       /* cards / chart surface */
  --ink: #0b0b0b;           /* primary text */
  --ink-2: #52514e;         /* secondary text */
  --muted: #898781;         /* axis / captions */
  --hairline: #e1e0d9;      /* gridlines / dividers */
  --border: rgba(11,11,11,0.10);
  --accent: #2a78d6;        /* interactive / series-1 blue */
  --accent-ink: #ffffff;
  /* Status palette — fixed, never used as series colors */
  --good: #0ca30c;
  --warn: #fab219;
  --serious: #ec835a;
  --crit: #d03b3b;
  --info: #2a78d6;
  --gray-status: #898781;
  /* Soft tint backgrounds for status banners */
  --good-bg: rgba(12,163,12,0.10);
  --warn-bg: rgba(250,178,25,0.14);
  --crit-bg: rgba(208,59,59,0.10);
  --gray-bg: rgba(137,135,129,0.12);
  --info-bg: rgba(42,120,214,0.10);
  /* Chart series (validated 4-slot categorical) */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --band: rgba(42,120,214,0.10); /* target-band wash */
  --radius: 16px;
  --tabbar-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --accent: #3987e5;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --band: rgba(57,135,229,0.14);
    --good-bg: rgba(12,163,12,0.16);
    --warn-bg: rgba(250,178,25,0.14);
    --crit-bg: rgba(208,59,59,0.18);
    --gray-bg: rgba(137,135,129,0.16);
    --info-bg: rgba(57,135,229,0.16);
  }
}

/* ============ RESET / BASE ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.45;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 12px; width: 100%; }
h1, h2, h3 { line-height: 1.2; }
svg { display: block; max-width: 100%; }

/* ============ LAYOUT ============ */
.screen { max-width: 640px; margin: 0 auto; padding: 16px 16px 24px; }
.screen-title { font-size: 22px; font-weight: 700; margin: 6px 0 14px; }
.subtitle { color: var(--ink-2); font-size: 14px; margin-top: -10px; margin-bottom: 14px; }

/* ============ CARDS ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}
.card h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
@media (min-width: 560px) { .card-grid { grid-template-columns: repeat(4, 1fr); } }
.card-grid .card { margin-bottom: 0; padding: 14px; }

/* Chemistry stat tile */
.stat-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.stat-value { font-size: 26px; font-weight: 650; margin: 2px 0; }
.stat-sub { font-size: 12px; color: var(--ink-2); }
.stat-status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; margin-top: 4px; }

/* ============ STATUS BANNER ============ */
.banner { border-radius: var(--radius); padding: 18px 16px; margin-bottom: 14px; border: 1px solid var(--border); }
.banner .b-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.banner .b-why { font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.banner-green { background: var(--good-bg); }
.banner-amber { background: var(--warn-bg); }
.banner-red   { background: var(--crit-bg); }
.banner-gray  { background: var(--gray-bg); }
.banner-blue  { background: var(--info-bg); }

/* Status dot + icon text */
.sdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.s-green .sdot { background: var(--good); }
.s-amber .sdot { background: var(--warn); }
.s-red .sdot { background: var(--crit); }
.s-gray .sdot { background: var(--gray-status); }
.s-blue .sdot { background: var(--info); }

/* ============ BUTTONS ============ */
.btn {
  display: block; width: 100%; text-align: center;
  padding: 15px 16px; border-radius: 14px; font-weight: 650; font-size: 16px;
  background: var(--surface); border: 1px solid var(--hairline); color: var(--ink);
  margin-bottom: 10px;
}
.btn:active { transform: scale(0.985); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-quiet { background: none; border: none; color: var(--accent); font-size: 14px; padding: 10px; }
.btn-danger { color: var(--crit); border-color: var(--crit); }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.btn[disabled] { opacity: 0.4; pointer-events: none; }

/* ============ TILES (test entry) ============ */
.tile-group { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
.tile {
  flex: 1 0 56px; min-height: 52px; border-radius: 12px;
  border: 2px solid var(--hairline); background: var(--surface);
  font-size: 17px; font-weight: 650; position: relative;
}
.tile .tile-swatch { display: block; width: 22px; height: 6px; border-radius: 3px; margin: 4px auto 0; }
.tile.sel { border-color: var(--accent); background: var(--info-bg); }
.tile.dim { opacity: 0.35; }

/* ============ TIMER ============ */
.timer-wrap { text-align: center; padding: 30px 0; }
.timer-num { font-size: 72px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer-label { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.timer-warn { color: var(--ink-2); margin-top: 10px; font-size: 15px; }

/* ============ LISTS / TIMELINE ============ */
.tl-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
.tl-item:last-child { border-bottom: none; }
.tl-icon { font-size: 18px; flex: none; width: 28px; text-align: center; }
.tl-body { flex: 1; min-width: 0; }
.tl-when { font-size: 12px; color: var(--muted); }
.tl-title { font-weight: 600; font-size: 15px; }
.tl-detail { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; }
.tl-divider { text-align: center; font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; padding: 12px 0 4px; border-top: 2px solid var(--accent); margin-top: 10px; }

/* ============ PROGRESS (fresh fill) ============ */
.prog-bar { height: 8px; border-radius: 4px; background: var(--hairline); overflow: hidden; margin: 8px 0 4px; }
.prog-fill { height: 100%; background: var(--accent); border-radius: 4px; }
.prog-steps { list-style: none; margin: 12px 0; }
.prog-steps li { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 15px; }
.prog-steps .p-mark { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; border: 2px solid var(--hairline); color: var(--muted); }
.prog-steps li.done .p-mark { background: var(--good); border-color: var(--good); color: #fff; }
.prog-steps li.current { font-weight: 700; }
.prog-steps li.current .p-mark { border-color: var(--accent); color: var(--accent); }

/* ============ FORMS / SETTINGS ============ */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }
details.why { margin-top: 10px; font-size: 14px; }
details.why summary { color: var(--accent); font-weight: 600; cursor: pointer; }
details.why p { margin-top: 6px; color: var(--ink-2); }
.safety { font-size: 13px; color: var(--ink-2); background: var(--warn-bg); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }

/* ============ CHIPS / SEGMENTED ============ */
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.seg button { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--hairline); background: var(--surface); font-size: 13px; font-weight: 600; }
.seg button.sel { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* ============ CHART ============ */
.chart-card { padding: 14px 8px 8px 4px; }
.chart-card h3 { padding-left: 12px; }
.chart-tip {
  position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 12px; font-size: 13px; max-width: 240px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.18); pointer-events: none;
}
.legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 6px 12px; font-size: 12px; color: var(--ink-2); }
.legend .lg { display: inline-flex; align-items: center; gap: 5px; }
.legend .lg i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

/* ============ TAB BAR ============ */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  display: flex; background: var(--surface); border-top: 1px solid var(--hairline);
  padding-bottom: env(safe-area-inset-bottom); height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
}
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 600; color: var(--muted); }
.tabbar button.sel { color: var(--accent); }
.tabbar .t-ico { font-size: 20px; line-height: 1; }

/* misc */
.muted { color: var(--muted); font-size: 13px; }
.spacer { height: 8px; }
.result-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--hairline); font-size: 15px; }
.result-row:last-child { border-bottom: none; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.badge-green { background: var(--good-bg); color: var(--good); }
.badge-amber { background: var(--warn-bg); color: #8a6100; }
.badge-red { background: var(--crit-bg); color: var(--crit); }
.badge-gray { background: var(--gray-bg); color: var(--muted); }
.badge-blue { background: var(--info-bg); color: var(--accent); }
@media (prefers-color-scheme: dark) { .badge-amber { color: var(--warn); } }
</style>
</head>
<body>
<div id="app"></div>
<div id="tip" class="chart-tip" style="display:none"></div>
<script>
/* ============================================================
   JOEL'S HOT TUB WATER MANAGER
   Single-file, offline, no-dependency spa water assistant.

   Code sections:
     1. Constants (profile, targets, test kit, chemicals)
     2. Storage & state model
     3. Pure chemistry/diagnostic engine  (no DOM access — testable)
     4. Fresh-fill state machine helpers
     5. Maintenance engine
     6. Dose calculator
     7. Rendering + navigation + event handlers
     8. Charts (inline SVG, time-scaled)
     9. Import / export
    10. App initialization (guarded so this file runs under Node for tests)

   Operating philosophy: TEST → DIAGNOSE → CORRECT ONE THING →
   CIRCULATE → RETEST. The app recommends as little chemical as
   necessary, in the correct order, based on measured conditions.
   ============================================================ */

"use strict";

/* ============================================================
   1. CONSTANTS
   ============================================================ */

const STORAGE_KEY = "joelsHotTubApp_v1";
const APP_VERSION = 1;

// Joel's spa profile (editable in Settings; these are the defaults).
const SPA_PROFILE = {
  ownerName: "Joel",
  manufacturer: "Canadian Hot Tubs",
  model: "Algonquin",
  volumeGallons: 600,
  volumeLitres: 2270,
  sanitizerSystem: "bromine",
  ionizer: false,
  dispenserType: "floating bromine tablet dispenser",
  regularBathers: 5,
  typicalUse: "weekly",
  household: "2 adults + 3 kids"
};

// Water chemistry targets. These are SPA targets — the Hach strip
// has coarser increments, and the engine never invents precision
// the strip cannot provide.
const SPA_TARGETS = {
  bromine:    { min: 3,   max: 5 },
  pH:         { min: 7.2, idealMin: 7.4, idealMax: 7.6, max: 7.8 },
  alkalinity: { min: 80,  max: 120 },
  hardness:   { min: 150, max: 250 }
};

// Test-kit definitions. Targets, kit capabilities, and chemical
// products are deliberately decoupled so future kits (drop kit,
// digital tester) can plug in without touching chemistry rules.
const TEST_KITS = {
  hach_pool_spa_6way: {
    id: "hach_pool_spa_6way",
    name: "Hach Pool & Spa Test Strips",
    entry: "discrete",           // discrete strip buckets, tile entry
    readDelaySeconds: 15,
    instructions: {
      dip: "Dip strip into water and remove immediately.",
      wait: "Hold strip level for 15 seconds.",
      warning: "Do not shake excess water from strip."
    },
    // Physical pad order on the bottle chart, filtered to the
    // parameters relevant to a bromine spa. Chlorine and cyanuric
    // acid are hidden because this spa sanitizes with bromine.
    parameters: {
      hardness:   { label: "Total Hardness",   unit: "ppm", values: [0, 100, 250, 500, 1000] },
      bromine:    { label: "Total Bromine",    unit: "ppm", values: [0, 1, 2, 5, 10, 20] },
      pH:         { label: "pH",               unit: "",    values: [6.2, 6.8, 7.2, 7.8, 8.4] },
      alkalinity: { label: "Total Alkalinity", unit: "ppm", values: [0, 40, 80, 120, 180, 240] }
    },
    padOrder: ["hardness", "bromine", "pH", "alkalinity"],
    hiddenParameters: ["totalChlorine", "freeChlorine", "cyanuricAcid"]
  },
  drop_kit:      { id: "drop_kit",      name: "Drop Test Kit",  entry: "numeric", readDelaySeconds: 0,
                   parameters: {}, padOrder: ["hardness", "bromine", "pH", "alkalinity"], instructions: {} },
  digital_tester:{ id: "digital_tester", name: "Digital Tester", entry: "numeric", readDelaySeconds: 0,
                   parameters: {}, padOrder: ["hardness", "bromine", "pH", "alkalinity"], instructions: {} }
};

// Approximate Hach chart pad colors — decorative hints only. The
// number is always shown; color is never the sole channel.
const PAD_COLORS = {
  hardness:   { 0:"#7ec8e3", 100:"#9db8d9", 250:"#8d9dcb", 500:"#7c72ad", 1000:"#6a4f96" },
  bromine:    { 0:"#f6f0b9", 1:"#f3e396", 2:"#efd06f", 5:"#c88f3f", 10:"#a66a92", 20:"#7d4a86" },
  pH:         { 6.2:"#f2b04e", 6.8:"#ec9a45", 7.2:"#e5813f", 7.8:"#d9603c", 8.4:"#c74a48" },
  alkalinity: { 0:"#f0e27a", 40:"#cfd97a", 80:"#a8c973", 120:"#7cb46e", 180:"#4f9a68", 240:"#2c7e5f" }
};

// Chemical inventory. Doses are NEVER hardcoded — a dose is only
// calculated once the actual product-label numbers are configured.
const DEFAULT_CHEMICALS = [
  { id: "spalife_brominating_tabs", name: "SpaLife Brominating Tabs", role: "maintenance sanitizer",
    type: "bromine tablets", delivery: "floating dispenser", configured: true,
    purpose: "Slow-release bromine used to maintain sanitizer level.", dosing: null },
  { id: "regal_brom_granules", name: "Regal Spa Brom Granules", role: "fast sanitizer correction",
    type: "bromine granules", configured: true,
    purpose: "Fast-acting bromine used to establish or restore sanitizer level.", dosing: null },
  { id: "aquarius_chlorine_free_shock", name: "Aquarius Spa Shock", role: "oxidizer",
    type: "non-chlorine shock", configured: true,
    purpose: "Oxidizes bather waste and supports the bromine system.", dosing: null },
  { id: "aqua_cal", name: "Aqua Cal Hardness Treatment", role: "hardness increaser",
    type: "calcium hardness increaser", configured: true,
    purpose: "Raises calcium hardness.", dosing: null },
  { id: "hach_pool_spa_6way", name: "Hach Pool & Spa Test Strips", role: "testing",
    type: "test strips", configured: true, purpose: "Water testing.", dosing: null },
  // Placeholders Joel hasn't bought/configured yet:
  { id: "alkalinity_increaser", name: "Alkalinity increaser", role: "alkalinity increaser",
    type: "placeholder", configured: false, purpose: "Raises total alkalinity.",
    dosing: null, brand: "", notes: "" },
  { id: "ph_increaser", name: "pH increaser", role: "pH increaser",
    type: "placeholder", configured: false, purpose: "Raises pH.", dosing: null, brand: "", notes: "" },
  { id: "ph_decreaser", name: "pH decreaser", role: "pH decreaser",
    type: "placeholder", configured: false, purpose: "Lowers pH.", dosing: null, brand: "", notes: "" }
];

// Fresh-fill / startup state machine states, in required order.
const STARTUP_STATES = ["refill", "initial_test", "alkalinity", "ph", "hardness", "bromine", "final_test", "complete"];

const STARTUP_STEP_LABELS = {
  refill: "Refill", initial_test: "Initial test", alkalinity: "Alkalinity", ph: "pH",
  hardness: "Hardness", bromine: "Bromine", final_test: "Final test", complete: "Complete"
};

// Default maintenance cadence (days unless noted). Configurable in Settings.
const DEFAULT_INTERVALS = {
  shockDays: 7,
  filterRinseDays: 14,
  filterCleanDays: 30,
  filterReplaceMonths: 10,   // configurable 9–12
  waterChangeDays: 90,       // configurable 60/90/120/custom
  quickTestDays: 3,          // bromine/pH freshness tolerance
  fullTestDays: 7,
  hardnessTestDays: 30       // hardness ages more gracefully than sanitizer
};

const PARAM_LABELS = { bromine: "Bromine", pH: "pH", alkalinity: "Alkalinity", hardness: "Hardness" };
const PARAM_ORDER = ["bromine", "pH", "alkalinity", "hardness"];

const EVENT_TYPES = ["water_test", "chemical_added", "shock", "soak", "filter_rinse", "filter_clean",
  "filter_replace", "drain_started", "refill", "startup_complete", "floater_change", "note"];

const DAY_MS = 24 * 60 * 60 * 1000;

/* ============================================================
   2. STORAGE & STATE MODEL
   ============================================================ */

function defaultState() {
  return {
    version: APP_VERSION,
    spaProfile: JSON.parse(JSON.stringify(SPA_PROFILE)),
    testKit: "hach_pool_spa_6way",
    targets: JSON.parse(JSON.stringify(SPA_TARGETS)),
    chemicalInventory: JSON.parse(JSON.stringify(DEFAULT_CHEMICALS)),
    events: [],                      // generic event log — source of truth
    maintenance: {
      intervals: Object.assign({}, DEFAULT_INTERVALS),
      lastRefillDate: null,          // ISO string of most recent refill
      floater: { tablets: null, opening: null, loadedAt: null }
    },
    startup: { active: false, state: null },   // fresh-fill wizard
    settings: {
      spaName: "Algonquin",
      showEventMarkers: true,
      shockAfterHeavyUse: false      // recommend, don't require, unless enabled
    }
  };
}

// Simple id generator (no Date.now dependency at module scope; callers pass timestamps).
let _idCounter = 0;
function makeId(prefix, timestamp) {
  _idCounter += 1;
  return prefix + "_" + timestamp.replace(/[^0-9]/g, "").slice(0, 14) + "_" + _idCounter;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    // Shallow-merge onto defaults so new fields appear after upgrades.
    const base = defaultState();
    const merged = Object.assign(base, parsed);
    merged.maintenance = Object.assign(base.maintenance, parsed.maintenance || {});
    merged.maintenance.intervals = Object.assign(Object.assign({}, DEFAULT_INTERVALS), (parsed.maintenance || {}).intervals || {});
    merged.settings = Object.assign(base.settings, parsed.settings || {});
    return merged;
  } catch (e) {
    return defaultState();
  }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// Append an event and keep the log chronologically sorted.
function addEvent(state, type, data, notes, when) {
  const ts = (when && typeof when.toISOString === "function") ? when.toISOString() : when;
  const d = new Date(ts);
  const ev = {
    id: makeId(type === "water_test" ? "test" : "ev", ts),
    timestamp: ts,
    localDate: localDateStr(d),
    localTime: localTimeStr(d),
    year: d.getFullYear(),
    type: type,
    data: data || {},
    notes: notes || ""
  };
  if (type === "water_test") ev.waterCycleId = currentCycleId(state);
  state.events.push(ev);
  state.events.sort((a, b) => a.timestamp < b.timestamp ? -1 : 1);
  return ev;
}

function localDateStr(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function localTimeStr(d) {
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

/* ============================================================
   3. PURE CHEMISTRY / DIAGNOSTIC ENGINE
   Every function here is DOM-free and takes explicit inputs
   (including `now`) so it can run under Node for the test suite.
   ============================================================ */

// A stored reading value is either  { value, approximate:false }
// or a between-two-colors range     { lower, upper, approximate:true }.
// asInterval() gives a uniform [lo, hi] view. We never collapse a
// range to a midpoint in storage — only for chart placement, clearly marked.
function asInterval(v) {
  if (v == null) return null;
  if (typeof v === "number") return { lo: v, hi: v, approximate: false };
  if (v.approximate && v.lower != null) return { lo: v.lower, hi: v.upper, approximate: true };
  if (v.value != null) return { lo: v.value, hi: v.value, approximate: !!v.approximate };
  return null;
}

// Classify an interval against a [min,max] target:
//  "in"         — entire interval inside target
//  "low"/"high" — entirely outside on one side
//  "borderline" — interval crosses a target boundary (ambiguous strip read)
function rangeStatus(v, min, max) {
  const iv = asInterval(v);
  if (!iv) return "unknown";
  if (iv.lo >= min && iv.hi <= max) return "in";
  if (iv.hi < min) return "low";
  if (iv.lo > max) return "high";
  return "borderline";
}

// ---- Bromine interpretation (strip buckets 0/1/2/5/10/20; target 3–5) ----
// 0,1 → red, block use. 2 → amber, still blocks normal use.
// 5 → ideal. 10 → high, block + do NOT add sanitizer. 20 → very high.
function interpretBromine(v, targets) {
  const t = (targets || SPA_TARGETS).bromine;
  const iv = asInterval(v);
  if (!iv) return { status: "gray", label: "Not tested", blocksUse: false };
  if (iv.approximate) {
    const rs = rangeStatus(v, t.min, t.max);
    if (rs === "in") return { status: "green", label: "In range", blocksUse: false };
    if (rs === "low") return { status: "red", label: "Low", blocksUse: true };
    if (rs === "high") return { status: iv.lo >= 10 ? "red" : "amber", label: "High", blocksUse: iv.lo >= 10 };
    // Ambiguous read crossing the target boundary: don't over-correct, retest.
    return { status: "amber", label: "Borderline — retest", blocksUse: false, borderline: true };
  }
  const b = iv.lo;
  if (b <= 1)  return { status: "red",   label: b === 0 ? "Very low" : "Too low", blocksUse: true };
  if (b === 2) return { status: "amber", label: "Below target", blocksUse: true };
  if (b >= 20) return { status: "red",   label: "Very high", blocksUse: true };
  if (b >= 10) return { status: "red",   label: "High", blocksUse: true };
  if (b >= t.min && b <= t.max) return { status: "green", label: "Ideal", blocksUse: false };
  if (b > t.max) return { status: "amber", label: "Above target", blocksUse: false };
  return { status: "amber", label: "Below target", blocksUse: true };
}

// ---- pH interpretation (strip buckets 6.2/6.8/7.2/7.8/8.4; target 7.2–7.8) ----
function interpretPH(v, targets) {
  const t = (targets || SPA_TARGETS).pH;
  const iv = asInterval(v);
  if (!iv) return { status: "gray", label: "Not tested" };
  const rs = rangeStatus(v, t.min, t.max);
  if (rs === "in") return { status: "green", label: "In range" };
  if (rs === "borderline") return { status: "amber", label: "Borderline — retest", borderline: true };
  if (rs === "low")  return { status: iv.hi <= 6.2 ? "red" : "amber", label: "Low" };
  return { status: iv.lo >= 8.4 ? "red" : "amber", label: "High" };
}

// ---- Alkalinity interpretation (0/40/80/120/180/240; target 80–120) ----
function interpretAlkalinity(v, targets) {
  const t = (targets || SPA_TARGETS).alkalinity;
  const iv = asInterval(v);
  if (!iv) return { status: "gray", label: "Not tested" };
  const rs = rangeStatus(v, t.min, t.max);
  if (rs === "in") return { status: "green", label: "In range" };
  if (rs === "borderline") return { status: "amber", label: "Borderline — retest", borderline: true };
  if (rs === "low") return { status: "amber", label: "Low" };
  return { status: iv.lo >= 240 ? "red" : "amber", label: iv.lo >= 240 ? "Very high" : "High" };
}

// ---- Hardness interpretation (0/100/250/500/1000; target ~150–250) ----
// The strip cannot resolve 150–200, so 250 counts as acceptable and
// hardness readings always display with the ~ approximate marker.
function interpretHardness(v, targets) {
  const iv = asInterval(v);
  if (!iv) return { status: "gray", label: "Not tested" };
  if (iv.hi <= 0)   return { status: "amber", label: "Very low" };
  if (iv.hi <= 100) return { status: "amber", label: "Low" };
  if (iv.lo >= 500) return { status: "amber", label: "High" };
  if (iv.approximate && iv.lo <= 100) return { status: "amber", label: "Possibly low — retest", borderline: true };
  return { status: "green", label: "In range" };
}

const INTERPRETERS = { bromine: interpretBromine, pH: interpretPH, alkalinity: interpretAlkalinity, hardness: interpretHardness };

function interpretParam(param, v, targets) {
  return INTERPRETERS[param](v, targets);
}

// Format a reading value for display without inventing precision.
// Hardness (and any range) gets the ~ approximate marker.
function formatValue(param, v) {
  const iv = asInterval(v);
  if (!iv) return "—";
  const unit = param === "pH" ? "" : " ppm";
  if (iv.approximate && iv.lo !== iv.hi) return "~" + iv.lo + "–" + iv.hi + unit;
  const prefix = (param === "hardness" || iv.approximate) ? "~" : "";
  return prefix + iv.lo + unit;
}

/* ---------- Latest readings & freshness ---------- */

function waterTests(state) {
  return state.events.filter(e => e.type === "water_test");
}

// Latest reading of one parameter across all tests (quick tests only
// carry bromine+pH, so each parameter is tracked independently).
function latestReading(state, param) {
  const tests = waterTests(state);
  for (let i = tests.length - 1; i >= 0; i--) {
    if (tests[i].data.values && tests[i].data.values[param] != null) {
      return { value: tests[i].data.values[param], test: tests[i] };
    }
  }
  return null;
}

function ageDays(iso, now) {
  return (now.getTime() - new Date(iso).getTime()) / DAY_MS;
}

// Heavy soak = 4+ bathers, any heavy-use flag, or a 60+ minute soak.
function isHeavySoak(ev) {
  const d = ev.data || {};
  return (d.bathers >= 4) || (d.heavy && d.heavy.length > 0) || d.duration === "60+ min";
}

// Per-parameter freshness. After a heavy soak that postdates the last
// sanitizer reading, the sanitizer tolerance drops to zero — test again.
function paramFreshness(state, param, now) {
  const r = latestReading(state, param);
  const iv = state.maintenance.intervals;
  const tol = (param === "hardness") ? iv.hardnessTestDays
            : (param === "alkalinity") ? iv.fullTestDays
            : iv.quickTestDays;
  if (!r) return { tested: false, stale: true, days: null, toleranceDays: tol };
  const days = ageDays(r.test.timestamp, now);
  let stale = days > tol;
  if ((param === "bromine" || param === "pH") && !stale) {
    const soaksSince = state.events.filter(e =>
      e.type === "soak" && e.timestamp > r.test.timestamp && isHeavySoak(e));
    if (soaksSince.length > 0) stale = true;
  }
  return { tested: true, stale, days, toleranceDays: tol, reading: r };
}

/* ---------- Diagnostic priority engine ----------
   Priority: 1 sanitizer → 2 alkalinity → 3 pH → 4 hardness → 5 shock.
   One corrective chemistry action at a time: the UI surfaces only the
   first action. pH correction is suppressed until alkalinity is
   confirmed in range (alkalinity before pH). Borderline (ambiguous
   strip range) readings recommend a retest, never a large correction. */
function diagnose(values, targets, context) {
  targets = targets || SPA_TARGETS;
  const actions = [];
  const v = values || {};

  // 1. SANITIZER — safety overrides normal sequencing.
  if (v.bromine != null) {
    const br = interpretBromine(v.bromine, targets);
    const iv = asInterval(v.bromine);
    if (br.borderline) {
      actions.push({ priority: 1, severity: "amber", parameter: "bromine",
        title: "Confirm bromine with a retest",
        message: "The strip read was between two colors across the target boundary. Retest before correcting.",
        blocksUse: false, retestOnly: true });
    } else if (iv && iv.lo >= 10) {
      actions.push({ priority: 1, severity: "red", parameter: "bromine",
        title: "Bromine is high",
        message: "Do not add more sanitizer. Allow the level to fall and retest before using the spa.",
        blocksUse: true, doNotAdd: true });
    } else if (iv && iv.hi <= 1) {
      actions.push({ priority: 1, severity: "red", parameter: "bromine",
        title: "Restore bromine",
        message: "Bromine is too low for normal spa use.",
        blocksUse: true });
    } else if (iv && !iv.approximate && iv.lo === 2) {
      actions.push({ priority: 1, severity: "amber", parameter: "bromine",
        title: "Bromine is below target",
        message: "Restore bromine before normal use.",
        blocksUse: true });
    } else if (br.blocksUse) {
      actions.push({ priority: 1, severity: br.status, parameter: "bromine",
        title: "Restore bromine", message: "Bromine is below the normal operating range.", blocksUse: true });
    }
  }

  // 2. ALKALINITY — corrected before pH.
  let alkConfirmedIn = false;
  if (v.alkalinity != null) {
    const rs = rangeStatus(v.alkalinity, targets.alkalinity.min, targets.alkalinity.max);
    alkConfirmedIn = rs === "in";
    if (rs === "low" || rs === "high") {
      actions.push({ priority: 2, severity: "amber", parameter: "alkalinity",
        title: "Correct alkalinity first",
        message: rs === "low" ? "Total alkalinity is low. Correct alkalinity before adjusting pH."
                              : "Total alkalinity is high. Correct alkalinity before adjusting pH.",
        blocksPHAdjustment: true });
    } else if (rs === "borderline") {
      actions.push({ priority: 2, severity: "amber", parameter: "alkalinity",
        title: "Alkalinity is borderline",
        message: "The reading spans the target boundary. Retest before making any correction.",
        retestOnly: true, blocksPHAdjustment: true });
    }
  }

  // 3. pH — only once alkalinity is confirmed in range (or wasn't measured
  // this test but the point stands: never chase pH under bad alkalinity).
  if (v.pH != null) {
    const rs = rangeStatus(v.pH, targets.pH.min, targets.pH.max);
    const alkOk = v.alkalinity == null ? true : alkConfirmedIn;
    if (alkOk && (rs === "low" || rs === "high")) {
      actions.push({ priority: 3, severity: "amber", parameter: "pH",
        title: "Correct pH",
        message: rs === "low" ? "pH is below the target range." : "pH is above the target range." });
    } else if (alkOk && rs === "borderline") {
      actions.push({ priority: 3, severity: "amber", parameter: "pH",
        title: "pH is borderline", message: "Retest before correcting.", retestOnly: true });
    }
  }

  // 4. HARDNESS — informational; never urgent.
  if (v.hardness != null) {
    const iv = asInterval(v.hardness);
    if (iv && iv.hi <= 100) {
      actions.push({ priority: 4, severity: "info", parameter: "hardness",
        title: "Hardness appears low",
        message: "Consider raising calcium hardness with Aqua Cal, using label-based dosing." });
    } else if (iv && iv.lo >= 500) {
      actions.push({ priority: 4, severity: "info", parameter: "hardness",
        title: "Hardness is high",
        message: "Do not add hardness increaser. High hardness is usually resolved at the next water change." });
    }
  }

  return actions.sort((a, b) => a.priority - b.priority);
}

/* ---------- "Can we use it?" engine ---------- */
function canWeUseIt(state, now) {
  // Active fresh-fill: water is mid-setup. (The "complete" state has
  // passed final verification, so it no longer blocks use.)
  if (startupInProgress(state)) {
    return { verdict: "NOT_YET", reason: "Fresh-fill setup is in progress. Finish water setup before using the spa." };
  }
  const brFresh = paramFreshness(state, "bromine", now);
  if (!brFresh.tested) {
    return { verdict: "TEST_FIRST", reason: "No sanitizer reading yet. Test before using the spa." };
  }
  if (brFresh.stale) {
    return { verdict: "TEST_FIRST", reason: "Your sanitizer reading is too old to rely on. Test before using the spa." };
  }
  // Chemicals added (or shock) after the last test → circulate & retest.
  const lastTest = brFresh.reading.test;
  const chemAfter = state.events.some(e =>
    (e.type === "chemical_added" || e.type === "shock") && e.timestamp > lastTest.timestamp);
  if (chemAfter) {
    return { verdict: "TEST_FIRST", reason: "Chemicals were added after the last test. Circulate and retest before using the spa." };
  }
  // Evaluate the latest reading of each parameter.
  const values = {};
  PARAM_ORDER.forEach(p => {
    const r = latestReading(state, p);
    if (r) values[p] = r.value;
  });
  const actions = diagnose(values, state.targets);
  const blocking = actions.find(a => a.blocksUse);
  if (blocking) {
    return { verdict: "NOT_YET", reason: blocking.message || blocking.title, action: blocking };
  }
  // A borderline sanitizer read (range crossing the target boundary) is
  // not proof of a safe residual — never answer YES from it.
  if (actions.some(a => a.parameter === "bromine" && a.retestOnly)) {
    return { verdict: "TEST_FIRST", reason: "The last bromine read was between two colors across the target boundary. Retest before using the spa." };
  }
  // Water clarity from the latest test's observations.
  const obs = lastTest.data.observations;
  if (obs && obs.appearance === "very cloudy") {
    return { verdict: "NOT_YET", reason: "Water was recorded as very cloudy. Resolve clarity before using the spa." };
  }
  const phFresh = paramFreshness(state, "pH", now);
  if (phFresh.stale) {
    return { verdict: "TEST_FIRST", reason: "The pH reading is out of date. Run a quick test before using the spa." };
  }
  return { verdict: "YES", reason: "Latest water readings are within normal operating ranges." };
}

/* ---------- Overall Today status (GREEN/AMBER/RED/GRAY) ---------- */
function overallStatus(state, now) {
  if (startupInProgress(state)) {
    return { color: "blue", title: "Fresh fill in progress", why: "Continue the water setup wizard to finish preparing the water." };
  }
  const brFresh = paramFreshness(state, "bromine", now);
  if (!brFresh.tested) {
    return { color: "gray", title: "Test water first", why: "No water tests recorded yet. Run a test to see where things stand." };
  }
  if (brFresh.stale) {
    return { color: "gray", title: "Test water first",
      why: "The sanitizer reading is " + (brFresh.days != null ? Math.floor(brFresh.days) + " day(s) old" : "out of date") + ". Test before relying on it." };
  }
  const values = {};
  PARAM_ORDER.forEach(p => { const r = latestReading(state, p); if (r) values[p] = r.value; });
  const actions = diagnose(values, state.targets);
  const blocking = actions.find(a => a.blocksUse);
  if (blocking) {
    return { color: "red", title: "Do not use yet", why: blocking.message || blocking.title, action: blocking };
  }
  if (actions.length > 0) {
    return { color: "amber", title: "Water needs attention", why: actions[0].message || actions[0].title, action: actions[0] };
  }
  return { color: "green", title: "Water looks good", why: "Water is balanced and the latest sanitizer reading is current." };
}

/* ---------- Water age & cycles ---------- */
function waterAgeDays(state, now) {
  const d = state.maintenance.lastRefillDate;
  if (!d) return null;
  return Math.floor(ageDays(d, now));
}

// A refill starts a new water cycle. Cycle id derives from refill date.
function currentCycleId(state) {
  const d = state.maintenance.lastRefillDate;
  if (!d) return "cycle_initial";
  return "cycle_" + localDateStr(new Date(d)).replace(/-/g, "_");
}

// Segment the event log into water cycles (refill events are the dividers).
function waterCycles(state) {
  const cycles = [];
  let current = { id: "cycle_initial", start: null, events: [] };
  state.events.forEach(ev => {
    if (ev.type === "refill") {
      if (current.events.length > 0 || current.start) cycles.push(current);
      current = { id: "cycle_" + ev.localDate.replace(/-/g, "_"), start: ev.timestamp, events: [] };
    }
    current.events.push(ev);
  });
  cycles.push(current);
  return cycles;
}

// Per-cycle summary stats (§86).
function cycleSummary(cycle, targets, now) {
  const tests = cycle.events.filter(e => e.type === "water_test");
  const pct = (param) => {
    const withP = tests.filter(t => t.data.values && t.data.values[param] != null);
    if (withP.length === 0) return null;
    const inR = withP.filter(t => {
      const st = interpretParam(param, t.data.values[param], targets).status;
      return st === "green";
    });
    return Math.round(100 * inR.length / withP.length);
  };
  const outCounts = {};
  PARAM_ORDER.forEach(p => {
    outCounts[p] = tests.filter(t => t.data.values && t.data.values[p] != null &&
      interpretParam(p, t.data.values[p], targets).status !== "green").length;
  });
  let worst = null;
  PARAM_ORDER.forEach(p => { if (outCounts[p] > 0 && (worst == null || outCounts[p] > outCounts[worst])) worst = p; });
  const end = cycle.events.length ? cycle.events[cycle.events.length - 1].timestamp : cycle.start;
  return {
    id: cycle.id,
    start: cycle.start,
    end: end,
    days: cycle.start ? Math.max(0, Math.floor((new Date(nowOrEnd(cycle, now)).getTime() - new Date(cycle.start).getTime()) / DAY_MS)) : null,
    testCount: tests.length,
    soakCount: cycle.events.filter(e => e.type === "soak").length,
    shockCount: cycle.events.filter(e => e.type === "shock").length,
    rinseCount: cycle.events.filter(e => e.type === "filter_rinse").length,
    chemCount: cycle.events.filter(e => e.type === "chemical_added").length,
    inRangePct: { bromine: pct("bromine"), pH: pct("pH"), alkalinity: pct("alkalinity") },
    mostOutOfRange: worst
  };
}
function nowOrEnd(cycle, now) {
  // Current cycle runs to `now`; completed cycles run to their last event.
  return now ? now.toISOString() : (cycle.events.length ? cycle.events[cycle.events.length - 1].timestamp : cycle.start);
}

/* ---------- Trend direction (dashboard cards) ---------- */
// Needs >= 3 readings; uses interval midpoints only for comparison,
// never for storage or display.
function trendDirection(vals) {
  const nums = vals.map(v => { const iv = asInterval(v); return iv ? (iv.lo + iv.hi) / 2 : null; }).filter(n => n != null);
  if (nums.length < 3) return "insufficient";
  const recent = nums.slice(-3);
  const [a, b, c] = recent;
  if (c > a && c >= b) return "rising";
  if (c < a && c <= b) return "falling";
  return "stable";
}

function paramTrend(state, param) {
  const vals = waterTests(state)
    .filter(t => t.data.values && t.data.values[param] != null)
    .map(t => t.data.values[param]);
  return trendDirection(vals);
}

/* ---------- Floater adjustment logic ----------
   Never react to a single reading. Require >= 2 consecutive
   normal-context readings on the same side before suggesting a
   permanent opening change; ignore post-soak/post-chemical readings. */
function floaterAdvice(state) {
  const normals = waterTests(state)
    .filter(t => (t.data.context || "normal") === "normal" && t.data.values && t.data.values.bromine != null);
  if (normals.length === 0) return { code: "none", message: "No normal-context bromine readings yet." };
  const statuses = normals.map(t => {
    const iv = asInterval(t.data.values.bromine);
    if (iv.hi <= 2) return "low";
    if (iv.lo >= 10) return "high";
    return "ok";
  });
  let lowStreak = 0, highStreak = 0, okStreak = 0;
  for (let i = statuses.length - 1; i >= 0; i--) {
    if (statuses[i] === "low" && highStreak === 0 && okStreak === 0) lowStreak++;
    else if (statuses[i] === "high" && lowStreak === 0 && okStreak === 0) highStreak++;
    else if (statuses[i] === "ok" && lowStreak === 0 && highStreak === 0) okStreak++;
    else break;
  }
  if (lowStreak >= 2) return { code: "increase", streak: lowStreak,
    message: "Bromine supply may be too low. After restoring sanitizer, slightly increase the floater opening." };
  if (highStreak >= 2) return { code: "decrease", streak: highStreak,
    message: "Reduce the floater opening slightly." };
  if (okStreak >= 2) return { code: "ok", streak: okStreak, message: "Floater setting appears correct." };
  return { code: "wait", message: "Waiting for a second consecutive normal-context reading before suggesting a floater change." };
}

/* ---------- Pattern detection (deterministic, explainable) ---------- */
function detectPatterns(state, now) {
  const patterns = [];
  const tests = waterTests(state);
  const targets = state.targets;

  // Repeated low bromine: >= 3 of the last 5 normal-context tests below target.
  const normalBr = tests.filter(t => (t.data.context || "normal") === "normal" &&
    t.data.values && t.data.values.bromine != null).slice(-5);
  if (normalBr.length >= 3) {
    const low = normalBr.filter(t => asInterval(t.data.values.bromine).hi <= 2);
    if (low.length >= 3) {
      patterns.push({ id: "low_bromine", title: "Bromine frequently runs low",
        detail: "At least 3 of the last 5 normal checks were below target. Your bromine dispenser may not be keeping up with normal demand.",
        suggestion: "Review the floater setting after restoring bromine." });
    }
  }

  // Post-soak bromine drop: in range before family use, low within ~24h after — twice or more.
  let postSoakDrops = 0;
  state.events.forEach((ev, i) => {
    if (ev.type !== "soak") return;
    const before = tests.filter(t => t.timestamp < ev.timestamp && t.data.values && t.data.values.bromine != null).pop();
    const after = tests.find(t => t.timestamp > ev.timestamp &&
      (new Date(t.timestamp) - new Date(ev.timestamp)) <= 24 * 3600 * 1000 &&
      t.data.values && t.data.values.bromine != null);
    if (before && after &&
        interpretBromine(before.data.values.bromine, targets).status === "green" &&
        asInterval(after.data.values.bromine).hi <= 2) postSoakDrops++;
  });
  if (postSoakDrops >= 2) {
    patterns.push({ id: "post_soak_drop", title: "Bromine drops after family use",
      detail: "Five bathers create a high sanitizer demand in 600 gallons. This is expected demand, not necessarily a floater failure.",
      suggestion: "Check sanitizer after heavy use before relying on the floater alone." });
  }

  // pH rising: >= 3 sequential pH readings trending upward.
  const phVals = tests.filter(t => t.data.values && t.data.values.pH != null)
    .map(t => { const iv = asInterval(t.data.values.pH); return (iv.lo + iv.hi) / 2; });
  if (phVals.length >= 3) {
    const last3 = phVals.slice(-3);
    if (last3[1] > last3[0] && last3[2] > last3[1]) {
      patterns.push({ id: "ph_rising", title: "pH tends to rise between tests",
        detail: "Three sequential pH readings have trended upward.",
        suggestion: "Watch alkalinity and continue testing before making repeated large corrections." });
    }
  }

  // Alkalinity consistently off on the same side: >= 3 consecutive readings.
  const alkStatuses = tests.filter(t => t.data.values && t.data.values.alkalinity != null)
    .map(t => rangeStatus(t.data.values.alkalinity, targets.alkalinity.min, targets.alkalinity.max));
  if (alkStatuses.length >= 3) {
    const last3 = alkStatuses.slice(-3);
    if (last3.every(s => s === "low")) {
      patterns.push({ id: "alk_low", title: "Alkalinity has remained low across multiple tests",
        detail: "Three consecutive readings were below target.", suggestion: "Correct alkalinity before any pH work." });
    } else if (last3.every(s => s === "high")) {
      patterns.push({ id: "alk_high", title: "Alkalinity has remained high across multiple tests",
        detail: "Three consecutive readings were above target.", suggestion: "Correct alkalinity before any pH work." });
    }
  }

  // Late-cycle instability: past ~60 days, out-of-range rate increases.
  const age = waterAgeDays(state, now);
  if (age != null && age >= 60) {
    const cycleTests = tests.filter(t => t.waterCycleId === currentCycleId(state));
    const early = [], late = [];
    cycleTests.forEach(t => {
      const tAge = ageDays(state.maintenance.lastRefillDate, new Date(t.timestamp));
      const anyOut = PARAM_ORDER.some(p => t.data.values && t.data.values[p] != null &&
        interpretParam(p, t.data.values[p], targets).status !== "green");
      (tAge >= 60 ? late : early).push(anyOut);
    });
    const rate = arr => arr.length ? arr.filter(Boolean).length / arr.length : 0;
    if (late.length >= 3 && early.length >= 3 && rate(late) > rate(early) + 0.2) {
      patterns.push({ id: "late_cycle", title: "Water has become harder to maintain later in this water cycle",
        detail: "Out-of-range results have increased past 60 days of water age.",
        suggestion: "Consider whether the next water change should occur earlier." });
    }
  }

  return patterns;
}

/* ---------- Bromine trend intelligence ---------- */
function bromineMetrics(state) {
  const brTests = waterTests(state).filter(t => t.data.values && t.data.values.bromine != null);
  const nums = brTests.map(t => { const iv = asInterval(t.data.values.bromine); return (iv.lo + iv.hi) / 2; });
  const last3 = nums.slice(-3);
  let lowStreak = 0, highStreak = 0;
  for (let i = brTests.length - 1; i >= 0; i--) {
    const iv = asInterval(brTests[i].data.values.bromine);
    if (iv.hi <= 2 && highStreak === 0) lowStreak++;
    else if (iv.lo >= 10 && lowStreak === 0) highStreak++;
    else break;
  }
  return {
    averageBromineLast3Tests: last3.length ? last3.reduce((a, b) => a + b, 0) / last3.length : null,
    consecutiveLowBromineTests: lowStreak,
    consecutiveHighBromineTests: highStreak
  };
}

/* ---------- Normalized balance score (§91) ----------
   0 = in range · positive = above range · negative = below range,
   in units of "target widths". Never presented as a measurement. */
function balanceScore(param, v, targets) {
  const t = (targets || SPA_TARGETS)[param];
  const iv = asInterval(v);
  if (!iv || !t) return null;
  const mid = (iv.lo + iv.hi) / 2;
  const width = t.max - t.min || 1;
  if (mid > t.max) return (mid - t.max) / width;
  if (mid < t.min) return (mid - t.min) / width;
  return 0;
}

/* ---------- Testing consistency (§93) ---------- */
function testingConsistency(state, now) {
  const cutoff = new Date(now.getTime() - 30 * DAY_MS).toISOString();
  const tests = waterTests(state).filter(t => t.timestamp >= cutoff);
  if (tests.length < 2) return { count: tests.length, avgIntervalDays: null };
  let gaps = 0;
  for (let i = 1; i < tests.length; i++) gaps += (new Date(tests[i].timestamp) - new Date(tests[i - 1].timestamp)) / DAY_MS;
  const avg = gaps / (tests.length - 1);
  return { count: tests.length, avgIntervalDays: Math.round(avg * 10) / 10, good: avg <= 4 };
}

/* ============================================================
   6. DOSE CALCULATOR
   A dose is only ever calculated from configured product-label
   data. Until a label is configured, the app says: follow the
   product label for 2,270 L / 600 US gallons.
   ============================================================ */
function computeDose(product, spaProfile) {
  if (!product || !product.dosing || !product.dosing.labelDose || !product.dosing.referenceVolume) return null;
  const d = product.dosing;
  const scaled = d.labelDose * spaProfile.volumeLitres / d.referenceVolume;
  return {
    amount: Math.round(scaled * 10) / 10,
    unit: d.unit || "g",
    perPpm: d.effectPerDose || null,
    note: "Scaled from the product label (" + d.labelDose + " " + (d.unit || "g") +
          " per " + d.referenceVolume + " L) for " + spaProfile.volumeLitres + " L."
  };
}

function findChemical(state, roleOrId) {
  return state.chemicalInventory.find(c => c.id === roleOrId) ||
         state.chemicalInventory.find(c => c.role === roleOrId);
}

/* ---------- Maintenance due calculations ---------- */
function lastEventOf(state, type) {
  for (let i = state.events.length - 1; i >= 0; i--) if (state.events[i].type === type) return state.events[i];
  return null;
}

function maintenanceStatus(state, now) {
  const iv = state.maintenance.intervals;
  const item = (type, intervalDays, label) => {
    const last = lastEventOf(state, type);
    if (!last) return { type, label, last: null, dueInDays: null, overdue: false };
    const days = ageDays(last.timestamp, now);
    return { type, label, last, lastDays: Math.floor(days), dueInDays: Math.ceil(intervalDays - days), overdue: days >= intervalDays };
  };
  const shock = item("shock", iv.shockDays, "Oxidation / shock");
  const rinse = item("filter_rinse", iv.filterRinseDays, "Filter rinse");
  const clean = item("filter_clean", iv.filterCleanDays, "Deep filter clean");
  const replace = item("filter_replace", iv.filterReplaceMonths * 30.4, "Filter replacement");
  const age = waterAgeDays(state, now);
  const water = { type: "water_change", label: "Water change", ageDays: age,
    intervalDays: iv.waterChangeDays,
    overdue: age != null && age >= iv.waterChangeDays,
    milestone: age == null ? null :
      age >= iv.waterChangeDays ? "Water change due." :
      age >= 80 ? "Consider planning a water change soon." :
      age >= 60 ? "Water is entering the later part of its normal service cycle." : null };
  return { shock, rinse, clean, replace, water };
}

/* ---------- Cloudy water / foam logic ---------- */
function cloudyWaterAdvice(state, now) {
  const br = latestReading(state, "bromine");
  const brStatus = br ? interpretBromine(br.value, state.targets) : null;
  if (!brStatus || brStatus.blocksUse || brStatus.status !== "green") {
    return { first: "Restore sanitizer first.", contributors: [] };
  }
  const contributors = [];
  const soaks = state.events.filter(e => e.type === "soak" &&
    ageDays(e.timestamp, now) <= 3 && isHeavySoak(e));
  if (soaks.length) contributors.push("Recent heavy bather load");
  const m = maintenanceStatus(state, now);
  if (m.rinse.overdue || m.rinse.last == null) contributors.push("Filter due for cleaning");
  const ph = latestReading(state, "pH");
  if (ph && interpretPH(ph.value, state.targets).status !== "green") contributors.push("pH out of range");
  const hd = latestReading(state, "hardness");
  if (hd && interpretHardness(hd.value, state.targets).status !== "green") contributors.push("Hardness out of range");
  const age = waterAgeDays(state, now);
  if (age != null && age >= 60) contributors.push("Water age (" + age + " days)");
  return { first: null, contributors };
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function statusBadge(status, label) {

  return '<span class="badge ' + cls + '">' + STATUS_ICON[status] + " " + esc(label || STATUS_WORD[status]) + "</span>";

function fmtDate(iso, withTime) {
  const d = new Date(iso);
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  let s = months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  if (withTime) {
    let h = d.getHours(), ampm = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
    s += " · " + h + ":" + String(d.getMinutes()).padStart(2, "0") + " " + ampm;
  }
  return s;
}

function agoStr(iso, now) {
  const days = Math.floor(ageDays(iso, now));
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  return days + " days ago";
}

// "What should I do?" — one primary action.
function actionCard(now) {
  const values = {};
  PARAM_ORDER.forEach(p => { const r = latestReading(state, p); if (r) values[p] = r.value; });
  const actions = diagnose(values, state.targets);
  const m = maintenanceStatus(state, now);
  let html = '<div class="card"><h3>What should I do?</h3>';
  if (actions.length > 0) {
    const a = actions[0];
    const r = latestReading(state, a.parameter);
    const t = state.targets[a.parameter];
    html += '<div class="tl-title">Do this first: ' + esc(a.title) + "</div>" +
      '<div class="tl-detail">' + esc(a.message || "") + "</div>" +
      (r && t ? '<div class="stat-sub" style="margin-top:6px">Current: ' + formatValue(a.parameter, r.value) +
        " · Target: " + t.min + "–" + t.max + (a.parameter === "pH" ? "" : " ppm") + "</div>" : "") +
      whyBlock(a.parameter);
    if (!a.retestOnly && !a.doNotAdd && a.parameter !== "bromine") {
      html += '<button class="btn" style="margin-top:10px" data-act="chem-action" data-arg="' + a.parameter + '">VIEW ACTION</button>';
    } else if (a.parameter === "bromine" && !a.doNotAdd && !a.retestOnly) {
      html += '<button class="btn" style="margin-top:10px" data-act="chem-action" data-arg="bromine">VIEW ACTION</button>';
    }
    html += '<button class="btn-quiet" data-act="retest" data-arg="' + a.parameter + '">Retest ' + PARAM_LABELS[a.parameter] + "</button>";
  } else {
    // No chemistry action → surface the most pressing maintenance/testing item.
    const brFresh = paramFreshness(state, "bromine", now);
    const fullDue = !waterTests(state).some(t => t.data.testType === "full" && ageDays(t.timestamp, now) <= state.maintenance.intervals.fullTestDays);
    if (!brFresh.tested || brFresh.stale) html += '<div class="tl-detail">Run a water test — the sanitizer reading is not current.</div>';
    else if (fullDue) html += '<div class="tl-detail">Weekly full water test is due.</div>';
    else if (m.water.overdue) html += '<div class="tl-detail">Water change is due (' + m.water.ageDays + " days old).</div>";
    else if (m.shock.overdue || !m.shock.last) html += '<div class="tl-detail">Weekly shock/oxidation is due.</div>';
    else if (m.rinse.overdue) html += '<div class="tl-detail">Filter rinse is due.</div>';
    else html += '<div class="tl-detail">Nothing urgent. Next: quick test in ' +
      Math.max(0, Math.ceil(state.maintenance.intervals.quickTestDays - (brFresh.days || 0))) + " day(s).</div>";
  }
  return html + "</div>";
}

    pH: "Proper pH helps protect bathers, equipment, and sanitizer effectiveness.",

// Tile entry for one parameter, with "between two colors" support.
function entryTiles(param) {
  const f = ui.testFlow;
  const def = f.kit.parameters[param];
  const vals = def.values;
  const between = f.between[param];
  const cur = f.values[param];
  let html = '<div class="card"><h3>' + esc(def.label) + (def.unit ? " (" + def.unit + ")" : "") + "</h3>" +
    '<div class="tile-group">';
  vals.forEach((v, i) => {
    let cls = "tile";
    if (between) {
      // In between-mode: first pick selects lower; only adjacent values selectable next.
      if (cur && cur.approximate && (v === cur.lower || v === cur.upper)) cls += " sel";
      else if (f._betweenFirst && f._betweenFirst.param === param) {
        const fi = vals.indexOf(f._betweenFirst.value);
        if (v === f._betweenFirst.value) cls += " sel";
        else if (Math.abs(i - fi) !== 1) cls += " dim";
      }
    } else if (cur && !cur.approximate && cur.value === v) cls += " sel";
    const pad = (PAD_COLORS[param] || {})[v];
    html += '<button class="' + cls + '" data-act="tile" data-param="' + param + '" data-val="' + v + '">' + v +
      (pad ? '<span class="tile-swatch" style="background:' + pad + '"></span>' : "") + "</button>";
  });
  html += "</div>" +
    '<button class="btn-quiet" data-act="between" data-param="' + param + '">' +
    (between ? "✓ Between two colors — tap the two adjacent values" : "Looks between two colors") + "</button>";
  if (cur) {
    html += '<div class="stat-sub">Selected: <b>' + formatValue(param, cur) + "</b></div>";
  }
  return html + "</div>";
}

  const values = {};
  f.params.forEach(p => {
    const v = f.values[p];
    if (v == null) return;
    if (v.approximate && v.lower != null) values[p] = { lower: v.lower, upper: v.upper, approximate: true };
    else values[p] = { value: v.value, unit: f.kit.parameters[p].unit || undefined,
      approximate: p === "hardness" ? true : false };
  });
  const data = {
    testType: f.mode === "retest" ? "retest" : f.mode,
    context: f.context,
    testKit: f.kit.id,
    precision: f.kit.entry === "discrete" ? "discrete-strip" : "numeric",
    values: values
  };
  if (Object.keys(f.observations).length) data.observations = f.observations;
  const ev = addEvent(state, "water_test", data, "", now);
  saveState(state);
  const cb = f.onSave;
  ui.testFlow = null;
  ui.lastResult = ev;
  if (cb) { cb(ev); return; }
  ui.route = "result";
  renderResult(ev);
}

function renderResult(ev) {
  const now = new Date();
  const values = ev.data.values;
  const actions = diagnose(values, state.targets, ev.data.context);
  let rows = "";
  PARAM_ORDER.forEach(p => {
    if (values[p] == null) return;
    const info = interpretParam(p, values[p], state.targets);
    rows += '<div class="result-row"><span>' + PARAM_LABELS[p] + "</span><span><b>" + formatValue(p, values[p]) + "</b> " +
      statusBadge(info.status, info.label) + "</span></div>";
  });
  let html = '<h1 class="screen-title">Test complete</h1><div class="card">' + rows + "</div>";
  // Context-aware framing: a low reading right after a soak is expected
  // demand, not automatically a floater problem.
  if (ev.data.context === "after_soak" && values.bromine && interpretBromine(values.bromine, state.targets).blocksUse) {
    html += '<div class="card"><div class="tl-detail">This reading was taken after use — a sanitizer dip after ' +
      state.spaProfile.regularBathers + " bathers is expected demand. Restore bromine, but no floater change is suggested from this reading alone.</div></div>";
  }
  if (actions.length > 0) {
    const a = actions[0];
    html += '<div class="card"><h3>Do this first</h3><div class="tl-title">' + esc(a.title) + "</div>" +
      '<div class="tl-detail">' + esc(a.message || "") + "</div>" + whyBlock(a.parameter);
    if (!a.retestOnly && !a.doNotAdd) html += '<button class="btn btn-primary" style="margin-top:10px" data-act="chem-action" data-arg="' + a.parameter + '">VIEW ACTION</button>';
    html += '<button class="btn-quiet" data-act="retest" data-arg="' + a.parameter + '">RETEST ' + PARAM_LABELS[a.parameter].toUpperCase() + "</button></div>";
  } else {
    html += '<div class="banner banner-green"><div class="b-title">✓ All readings look good</div></div>';
  }
  html += '<button class="btn" data-act="nav" data-arg="today">DONE</button>';
  document.getElementById("app").innerHTML = '<div class="screen">' + html + "</div>" + viewTabBar();
}

/* ============================================================
   4/7. FRESH FILL WIZARD (state machine lives in state.startup,
   persisted on every transition so reopening resumes exactly here)
   ============================================================ */
function setStartupState(s) {
  state.startup.state = s;
  // "complete" keeps the wizard active so the completion screen renders;
  // only ffFinish() (START NORMAL MAINTENANCE) deactivates the wizard and
  // records the startup_complete event.
  state.startup.active = s != null;
  saveState(state);
}

// True while the wizard still has balance work to do. The "complete"
// state shows a summary screen but no longer restricts spa use.
function startupInProgress(state) {
  return state.startup.active && state.startup.state !== "complete";
}

function freshFillProgress() {
  const steps = STARTUP_STATES.slice(0, 7); // exclude "complete"
  const curIdx = STARTUP_STATES.indexOf(state.startup.state);
  const doneCount = Math.min(curIdx, 7);
  let html = '<div class="prog-bar"><div class="prog-fill" style="width:' + Math.round(100 * doneCount / 7) + '%"></div></div>' +
    '<div class="muted">' + doneCount + ' of 7 steps</div><ul class="prog-steps">';
  steps.forEach((s, i) => {
    const cls = i < curIdx ? "done" : i === curIdx ? "current" : "";
    const mark = i < curIdx ? "✓" : i === curIdx ? "●" : "○";
    html += '<li class="' + cls + '"><span class="p-mark">' + mark + "</span>" + STARTUP_STEP_LABELS[s] + "</li>";
  });
  return html + "</ul>";
}

function viewFreshFill() {
  const s = state.startup.state;
  let html = '<h1 class="screen-title">Fresh water setup</h1>' +
    '<div class="card">' + freshFillProgress() + "</div>";
  const now = new Date();

  if (s === "refill") {
    html += '<div class="card"><div class="tl-title">Refill the ' + esc(state.settings.spaName) + "</div>" +
      '<p class="tl-detail" style="margin:8px 0">Fill the hot tub to its normal operating level.</p>' +
      '<ul class="prog-steps">' +
      ["Tub filled", "Filter installed", "Pumps/circulation running", "No balancing chemicals added yet"]
        .map(c => '<li><span class="p-mark">○</span>' + c + "</li>").join("") + "</ul></div>" +
      '<button class="btn btn-primary" data-act="ff-circulating">WATER IS CIRCULATING</button>';
  } else if (s === "initial_test") {
    html += '<div class="card"><div class="tl-title">Before adding anything, test the untreated fill water.</div>' +
      '<p class="tl-detail" style="margin-top:8px">Full Hach strip test: dip, remove immediately, hold level 15 seconds, then read hardness, bromine, pH and alkalinity.</p></div>' +
      '<button class="btn btn-primary" data-act="ff-initial-test">START INITIAL TEST</button>';
  } else if (s === "alkalinity" || s === "ph" || s === "hardness" || s === "bromine") {
    html += freshFillBalanceStep(s, now);
  } else if (s === "final_test") {
    html += '<div class="card"><div class="tl-title">Final water check</div>' +
      '<p class="tl-detail" style="margin-top:8px">Run one more full test to verify everything at once.</p>' +
      finalCheckTable() + "</div>" +
      '<button class="btn btn-primary" data-act="ff-final-test">RUN FINAL FULL TEST</button>';
  } else if (s === "complete") {
    html += '<div class="banner banner-green"><div class="b-title">✓ Water setup complete</div>' +
      '<div class="b-why">Normal maintenance begins now: quick tests 2–3× a week, full test weekly, shock weekly.</div></div>' +
      '<button class="btn btn-primary" data-act="ff-finish">START NORMAL MAINTENANCE</button>';
  }
  html += '<button class="btn-quiet" data-act="nav" data-arg="today">Back to Today</button>';
  return html;
}

// One balance step: evaluate latest reading → good/continue or correct/retest.
function freshFillBalanceStep(step, now) {
  const param = step === "ph" ? "pH" : step;
  const t = state.targets[param];
  const r = latestReading(state, param);
  const rs = r ? rangeStatus(r.value, t.min, t.max) : "unknown";
  const label = PARAM_LABELS[param];
  let html = '<div class="card"><h3>Current task</h3>';

  if (step === "bromine") {
    const br = r ? interpretBromine(r.value, state.targets) : null;
    const established = br && br.status === "green";
    if (established) {
      html += '<div class="banner banner-green" style="margin:0"><div class="b-title">✓ Bromine established</div></div>' +
        floaterSetupForm() + "</div>" +
        '<button class="btn btn-primary" data-act="ff-advance" data-arg="final_test">CONTINUE TO FINAL TEST</button>';
      return html;
    }
    // Overshot during establishment (10/20 ppm): sanitizer safety overrides
    // the "add granules" flow — never tell Joel to add more (§18, Rule 4).
    const ivHigh = r ? asInterval(r.value) : null;
    if (ivHigh && ivHigh.lo >= 10) {
      html += '<div class="tl-title">Bromine is high (' + formatValue("bromine", r.value) + ")</div>" +
        '<p class="tl-detail" style="margin:8px 0"><b>Do not add more sanitizer.</b> Circulate, allow the level to fall, and retest before continuing.</p></div>' +
        '<button class="btn btn-primary" data-act="ff-retest" data-param="bromine">RETEST BROMINE</button>';
      return html;
    }
    html += '<div class="tl-title">Establish sanitizer</div>' +
      '<p class="tl-detail" style="margin:8px 0">Target 3–5 ppm. The Hach strip’s ideal measurable point is 5 ppm — aim for a strip result around <b>5 ppm</b>.</p>' +
      '<div class="result-row"><span>Regal Brom Granules</span><span class="muted">fast correction — use now</span></div>' +
      '<div class="result-row"><span>SpaLife Brominating Tabs</span><span class="muted">slow maintenance — floater</span></div>' +
      '<p class="tl-detail" style="margin-top:8px">Use the label directions for Regal granules for ' +
      state.spaProfile.volumeLitres.toLocaleString() + " L / " + state.spaProfile.volumeGallons + " gallons, circulate, then retest.</p>" +
      '<div class="safety">Never premix spa chemicals. Add products separately and follow the product label.</div></div>' +
      '<button class="btn" data-act="ff-added" data-param="bromine" data-product="regal_brom_granules">I ADDED BROMINE GRANULES</button>' +
      '<button class="btn btn-primary" data-act="ff-retest" data-param="bromine">RETEST BROMINE</button>';
    return html;
  }

  if (rs === "in" || (step === "hardness" && r && interpretHardness(r.value, state.targets).status === "green")) {
    html += '<div class="banner banner-green" style="margin:0"><div class="b-title">✓ ' + label + " looks good</div>" +
      '<div class="b-why">' + label + ": " + formatValue(param, r.value) +
      (param === "pH" ? ". No pH chemical required." : "") + "</div></div></div>" +
      '<button class="btn btn-primary" data-act="ff-advance" data-arg="' + nextStartupState(step) + '">CONTINUE</button>';
    return html;
  }

  const dir = rs === "low" ? "low" : rs === "high" ? "high" : rs;
  html += '<div class="tl-title">' + label + " is " + (r ? formatValue(param, r.value) : "not tested yet") + "</div>" +
    '<div class="stat-sub">Target: ' + t.min + "–" + t.max + (param === "pH" ? "" : " ppm") + "</div>";

  if (step === "alkalinity") {
    html += '<p class="tl-detail" style="margin:8px 0"><b>Correct alkalinity first.</b> Alkalinity helps stabilize pH. Correcting pH first can cause you to chase the reading.</p>' +
      doseLine("alkalinity increaser") + "</div>" +
      '<button class="btn" data-act="ff-added" data-param="alkalinity" data-product="alkalinity_increaser">I ADDED ALKALINITY INCREASER</button>' +
      '<button class="btn btn-primary" data-act="ff-retest" data-param="alkalinity">RETEST ALKALINITY</button>' +
      '<button class="btn-quiet" data-act="ff-skip" data-arg="' + nextStartupState(step) + '">Skip for now</button>';
  } else if (step === "ph") {
    html += '<p class="tl-detail" style="margin:8px 0">Correct pH before continuing. Adjust → circulate → retest. A new reading closes this step.</p>' +
      doseLine(dir === "low" ? "pH increaser" : "pH decreaser") + "</div>" +
      '<button class="btn" data-act="ff-added" data-param="pH" data-product="' + (dir === "low" ? "ph_increaser" : "ph_decreaser") + '">I ADDED pH ' + (dir === "low" ? "INCREASER" : "DECREASER") + "</button>" +
      '<button class="btn btn-primary" data-act="ff-retest" data-param="pH">RETEST pH</button>' +
      '<button class="btn-quiet" data-act="ff-skip" data-arg="' + nextStartupState(step) + '">Skip for now</button>';
  } else if (step === "hardness") {
    const iv = r ? asInterval(r.value) : null;
    if (iv && iv.lo >= 500) {
      html += '<p class="tl-detail" style="margin:8px 0">Hardness is high. <b>Do not add hardness increaser.</b> High hardness is usually addressed at the next water change.</p></div>' +
        '<button class="btn btn-primary" data-act="ff-advance" data-arg="bromine">CONTINUE</button>';
    } else {
      html += '<p class="tl-detail" style="margin:8px 0">Hardness appears low. Use <b>Aqua Cal Hardness Treatment</b> with label-based dosing only.</p>' +
        doseLine("hardness increaser") + "</div>" +
        '<button class="btn" data-act="ff-added" data-param="hardness" data-product="aqua_cal">I ADDED AQUA CAL</button>' +
        '<button class="btn btn-primary" data-act="ff-retest" data-param="hardness">RETEST HARDNESS</button>' +
        '<button class="btn-quiet" data-act="ff-skip" data-arg="bromine">Skip for now</button>';
    }
  }
  return html;
}

function doseLine(role) {
  const product = findChemical(state, role);
  const dose = product ? computeDose(product, state.spaProfile) : null;
  const vol = state.spaProfile.volumeLitres.toLocaleString() + " L / " + state.spaProfile.volumeGallons + " gallons";
  if (dose) return '<div class="tl-detail"><b>' + esc(product.name) + ":</b> " + dose.amount + " " + dose.unit +
    ' <span class="muted">(' + esc(dose.note) + ")</span></div>";
  if (product && product.configured && product.type !== "placeholder")
    return '<div class="tl-detail">Use <b>' + esc(product.name) + "</b> — follow the product label for " + vol + ".</div>";
  return '<div class="tl-detail">No product configured yet. Use the product label for ' + vol + ". You can configure the label dose in Settings.</div>";
}

function nextStartupState(s) {
  return STARTUP_STATES[STARTUP_STATES.indexOf(s) + 1];
}

function floaterSetupForm() {
  const fl = state.maintenance.floater;
  return '<div style="margin-top:10px"><h3>Record floater setup</h3>' +
    '<div class="field-row"><div class="field"><label>Tablets</label><input type="number" min="0" max="10" id="fl-tabs" value="' + (fl.tablets || 3) + '"></div>' +
    '<div class="field"><label>Opening (1–10)</label><input type="number" min="1" max="10" id="fl-open" value="' + (fl.opening || 4) + '"></div></div>' +
    '<button class="btn" data-act="floater-save">SAVE FLOATER SETUP</button></div>';
}

function finalCheckTable() {
  let rows = "";
  PARAM_ORDER.forEach(p => {
    const r = latestReading(state, p);
    if (!r) return;
    const info = interpretParam(p, r.value, state.targets);
    rows += '<div class="result-row"><span>' + PARAM_LABELS[p] + "</span><span><b>" + formatValue(p, r.value) + "</b> " +
      statusBadge(info.status, info.label) + "</span></div>";
  });
  return rows;
}

// Fresh-fill flow actions --------------------------------------------------
function ffCirculating() {
  const now = new Date();
  state.maintenance.lastRefillDate = now.toISOString();
  addEvent(state, "refill", {}, "", now);
  setStartupState("initial_test");
  render();
}

function ffAfterInitialTest(ev) {
  // Never dump four corrections at once — the wizard walks alkalinity →
  // pH → hardness → bromine one at a time from here.
  setStartupState("alkalinity");
  ui.route = "freshfill";
  render();
}

function ffRetest(param) {
  // Dedicated retest: same 15-second strip procedure, one pad only.
  startTest("retest", param, "fresh_fill", function (ev) {
    ui.route = "freshfill";
    maybeAdvanceAfterRetest(param);
    render();
  });
}

function maybeAdvanceAfterRetest(param) {
  // A step closes on an acceptable NEW reading, never on "I added it".
  const s = state.startup.state;
  const r = latestReading(state, param);
  if (!r) return;
  if (s === "alkalinity" && param === "alkalinity" &&
      rangeStatus(r.value, state.targets.alkalinity.min, state.targets.alkalinity.max) === "in") setStartupState("ph");
  else if (s === "ph" && param === "pH" &&
      rangeStatus(r.value, state.targets.pH.min, state.targets.pH.max) === "in") setStartupState("hardness");
  else if (s === "hardness" && param === "hardness" &&
      interpretHardness(r.value, state.targets).status === "green") setStartupState("bromine");
  else if (s === "bromine" && param === "bromine" &&
      interpretBromine(r.value, state.targets).status === "green") { /* stays; UI shows established + floater form */ }
}

// Decide where the wizard goes after the final verification test:
// "complete" only when every reading is acceptable; otherwise back to
// the earliest failing balance step (alkalinity → pH → hardness → bromine).
function finalTestOutcome(values, targets) {
  const actions = diagnose(values, targets, "fresh_fill");
  if (actions.length === 0) return "complete";
  const stepFor = { alkalinity: "alkalinity", pH: "ph", hardness: "hardness", bromine: "bromine" };
  const first = ["alkalinity", "pH", "hardness", "bromine"].find(p => actions.some(a => a.parameter === p));
  return stepFor[first] || "final_test";
}

function ffFinalTest() {
  startTest("full", null, "fresh_fill", function (ev) {
    const next = finalTestOutcome(ev.data.values, state.targets);
    setStartupState(next);
    if (next !== "complete") {
      alert2("Final check found " + STARTUP_STEP_LABELS[next].toLowerCase() + " out of range — returning to that step.");
    }
    ui.route = "freshfill";
    render();
  });
}

function ffFinish() {
  const now = new Date();
  addEvent(state, "startup_complete", {}, "", now);
  state.startup.active = false;
  state.startup.state = null;
  saveState(state);
  go("today");
}

      (i < w.step ? "✓" : i === w.step ? "●" : "○") + "</span>" + s + "</li>").join("") + "</ul></div>" +
    (w.step < steps.length - 1 ?
      '<button class="btn btn-primary" data-act="wc-next">' + ["TUB IS DRAINED", "INTERIOR CLEANED", "FILTER DONE"][w.step] + "</button>" :
      '<button class="btn btn-primary" data-act="wc-refill">START REFILL &amp; FRESH-FILL SETUP</button>') +
    '<button class="btn-quiet" data-act="wc-cancel">Cancel</button>';
}

  } else {
    html += '<div class="tl-detail">No floater setup recorded yet.</div>';
  }

    (item.last ? "Last: " + fmtDate(item.last.timestamp) + " (" + agoStr(item.last.timestamp, now) + ")" +
      (item.overdue ? " — <b>due now</b>" : item.dueInDays != null ? " — due in " + item.dueInDays + " days" : "") :
      "Never recorded") + "</div>" +
