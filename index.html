      "Sanitizer is okay and no obvious contributor found. Circulate, keep the filter clean, and retest.")) + "</p></details>" +
    '<details class="why"><summary>Persistent foam</summary><p>' + esc(FOAM_ADVICE.message) +
    "<br>Common causes:<br>• " + FOAM_ADVICE.causes.map(esc).join("<br>• ") + "</p></details></div>";
  return html;
}

/* ============================================================
   8. CHARTS — inline SVG, time-scaled x axis, no libraries.
   Discrete strip values are plotted exactly as recorded; range
   readings render as a range bar with a hollow midpoint marker
   (placement only — storage stays a range). Out-of-range points
   are diamonds so shape, not just color, carries the distinction.
   ============================================================ */

const CHART_Y = {   // §90 preferred axis domains
  bromine:    (maxSeen) => [0, maxSeen >= 20 ? 20 : 10],
  pH:         () => [6.2, 8.4],
  alkalinity: () => [0, 240],
  hardness:   (maxSeen) => [0, Math.max(500, maxSeen)]
};

function chartTicks(param, dom) {
  if (param === "pH") return [6.2, 6.8, 7.2, 7.8, 8.4];
  if (param === "bromine") return dom[1] === 20 ? [0, 5, 10, 15, 20] : [0, 2, 5, 8, 10];
  if (param === "alkalinity") return [0, 80, 120, 180, 240];
  return [0, 100, 250, 500].filter(v => v <= dom[1]);
}

const EVENT_GLYPHS = { soak: "🛁", shock: "⚡", chemical_added: "🧪", filter_rinse: "🧽",
  filter_clean: "🧼", refill: "💧", floater_change: "🎯" };

function svgTrendChart(param, tests, events, targets, now) {
  const pts = tests.filter(t => t.data.values && t.data.values[param] != null)
    .map(t => ({ t: new Date(t.timestamp).getTime(), v: t.data.values[param], test: t }));
  if (pts.length === 0) return '<p class="muted" style="padding:0 12px 8px">No ' + PARAM_LABELS[param].toLowerCase() + " readings in this range yet.</p>";
  const W = 600, H = 210, L = 42, R = 12, T = 14, B = 34;
  const t0 = Math.min.apply(null, pts.map(p => p.t)), t1 = Math.max.apply(null, pts.map(p => p.t));
  const span = Math.max(t1 - t0, DAY_MS);   // ≥1 day so single points center sanely
  const x = tm => L + (W - L - R) * ((tm - t0) / span);
  const maxSeen = Math.max.apply(null, pts.map(p => asInterval(p.v).hi));
  const dom = CHART_Y[param](maxSeen);
  const y = v => T + (H - T - B) * (1 - (v - dom[0]) / (dom[1] - dom[0]));
  const tgt = targets[param];
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + PARAM_LABELS[param] + ' trend chart">';
  // Target band (visual range context — §81).
  s += '<rect x="' + L + '" y="' + y(tgt.max) + '" width="' + (W - L - R) + '" height="' + (y(tgt.min) - y(tgt.max)) +
    '" fill="var(--band)"/>' +
    '<text x="' + (L + 4) + '" y="' + (y(tgt.max) + 11) + '" font-size="9" fill="var(--muted)">target ' + tgt.min + "–" + tgt.max + "</text>";
  // Gridlines + y ticks (hairline, recessive).
  chartTicks(param, dom).forEach(v => {
    s += '<line x1="' + L + '" y1="' + y(v) + '" x2="' + (W - R) + '" y2="' + y(v) + '" stroke="var(--hairline)" stroke-width="1"/>' +
      '<text x="' + (L - 6) + '" y="' + (y(v) + 3) + '" font-size="10" text-anchor="end" fill="var(--muted)" font-variant-numeric="tabular-nums">' + v + "</text>";
  });
  // X-axis date labels: first, middle, last point times.
  const label = tm => { const d = new Date(tm); return (d.getMonth() + 1) + "/" + d.getDate(); };
  [t0, (t0 + t1) / 2, t1].forEach((tm, i) => {
    if (span <= DAY_MS && i !== 0) return;
    s += '<text x="' + x(tm) + '" y="' + (H - B + 16) + '" font-size="10" text-anchor="middle" fill="var(--muted)">' + label(tm) + "</text>";
  });
  // Maintenance event markers (toggleable, subtle — §84).
  if (state.settings.showEventMarkers && events) {
    events.filter(e => EVENT_GLYPHS[e.type] && e.type !== "water_test")
      .forEach(e => {
        const tm = new Date(e.timestamp).getTime();
        if (tm < t0 - DAY_MS / 2 || tm > t1 + DAY_MS / 2) return;
        s += '<line x1="' + x(tm) + '" y1="' + T + '" x2="' + x(tm) + '" y2="' + (H - B) + '" stroke="var(--hairline)" stroke-width="1" stroke-dasharray="none" opacity="0.7"/>' +
          '<text x="' + x(tm) + '" y="' + (H - B + 30) + '" font-size="10" text-anchor="middle">' + EVENT_GLYPHS[e.type] + "</text>";
      });
  }
  // Line through chronological points (midpoints used for geometry only).
  const mid = p => { const iv = asInterval(p.v); return (iv.lo + iv.hi) / 2; };
  if (pts.length > 1) {
    s += '<path d="' + pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(mid(p)).toFixed(1)).join(" ") +
      '" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  // Points. In-range: filled circle. Out-of-range: diamond. Range read:
  // vertical range bar + hollow marker (clearly approximate).
  pts.forEach(p => {
    const iv = asInterval(p.v);
    const st = interpretParam(param, p.v, targets).status;
    const cx = x(p.t), out = st !== "green";
    const tip = tooltipData(param, p, now);
    if (iv.approximate && iv.lo !== iv.hi) {
      s += '<line x1="' + cx + '" y1="' + y(iv.lo) + '" x2="' + cx + '" y2="' + y(iv.hi) + '" stroke="var(--series-1)" stroke-width="2"/>' +
        '<circle cx="' + cx + '" cy="' + y(mid(p)) + '" r="5" fill="var(--surface)" stroke="var(--series-1)" stroke-width="2" data-tip="' + tip + '"/>';
    } else if (out) {
      const cy = y(mid(p));
      s += '<rect x="' + (cx - 5) + '" y="' + (cy - 5) + '" width="10" height="10" transform="rotate(45 ' + cx + " " + cy +
        ')" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" data-tip="' + tip + '"/>';
    } else {
      s += '<circle cx="' + cx + '" cy="' + y(mid(p)) + '" r="4.5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" data-tip="' + tip + '"/>';
    }
    // Enlarged invisible hit target for touch.
    s += '<circle cx="' + cx + '" cy="' + y(mid(p)) + '" r="14" fill="transparent" data-tip="' + tip + '"/>';
  });
  s += "</svg>";
  return s + '<div class="legend"><span class="lg"><i style="background:var(--series-1)"></i>reading</span>' +
    '<span class="lg">◆ out of range</span><span class="lg">○ approximate range</span></div>';
}

// Tooltip payload for a chart point (§83): value, status, context,
// water age at test time, and the nearest preceding event.
function tooltipData(param, p, now) {
  const info = interpretParam(param, p.v, state.targets);
  const test = p.test;
  let age = "";
  if (state.maintenance.lastRefillDate && test.timestamp >= state.maintenance.lastRefillDate) {
    age = Math.floor(ageDays(state.maintenance.lastRefillDate, new Date(test.timestamp))) + " days";
  }
  const prev = state.events.filter(e => e.type !== "water_test" && e.timestamp < test.timestamp).pop();
  let prevTxt = "";
  if (prev) {
    const hrs = Math.round((new Date(test.timestamp) - new Date(prev.timestamp)) / 3600000);
    if (hrs <= 72) prevTxt = eventTitle(prev) + " · " + hrs + "h earlier";
  }
  const obj = {
    when: fmtDate(test.timestamp, true), param: PARAM_LABELS[param],
    value: formatValue(param, p.v), status: info.label,
    context: (test.data.context || "normal").replace(/_/g, " "),
    age: age, prev: prevTxt
  };
  return esc(JSON.stringify(obj));
}

// Tooltip fields round-trip through JSON.parse, so they arrive unescaped
// and can carry user-entered text (e.g. a configured chemical name inside
// the previous-event line). Escape every field before innerHTML insertion.
function tooltipHtml(d) {
  return "<b>" + esc(d.when) + "</b><br>" + esc(d.param) + ": <b>" + esc(d.value) + "</b> — " + esc(d.status) +
    "<br>Context: " + esc(d.context) + (d.age ? "<br>Water age: " + esc(d.age) : "") +
    (d.prev ? "<br><span class='muted'>Previous event: " + esc(d.prev) + "</span>" : "");
}

function bindCharts() {
  // One-time delegated handler for chart tooltips.
  if (bindCharts._done) return;
  bindCharts._done = true;
  const tip = document.getElementById("tip");
  document.addEventListener("click", function (e) {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (!el) { tip.style.display = "none"; return; }
    const d = JSON.parse(el.getAttribute("data-tip"));
    tip.innerHTML = tooltipHtml(d);
    tip.style.display = "block";
    const r = el.getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - 250, Math.max(8, r.left - 60)) + "px";
    tip.style.top = Math.max(8, r.top - tip.offsetHeight - 10) + "px";
  });
}

// Balance Overview — normalized distance-from-target (§91). Secondary
// to the raw charts; clearly labeled as normalized, not measurements.
function svgBalanceChart(tests, targets) {
  const series = PARAM_ORDER;
  const colors = ["var(--series-1)", "var(--series-2)", "var(--series-3)", "var(--series-4)"];
  const rows = tests.map(t => ({ t: new Date(t.timestamp).getTime(), v: t.data.values || {} }));
  if (rows.length < 2) return '<p class="muted" style="padding:0 12px 8px">Not enough tests yet for the balance overview.</p>';
  const W = 600, H = 180, L = 34, R = 12, T = 12, B = 24;
  const t0 = rows[0].t, t1 = rows[rows.length - 1].t, span = Math.max(t1 - t0, DAY_MS);
  const x = tm => L + (W - L - R) * ((tm - t0) / span);
  const clamp = v => Math.max(-2, Math.min(2, v));
  const y = v => T + (H - T - B) * (1 - (clamp(v) + 2) / 4);
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Balance overview, normalized">';
  s += '<line x1="' + L + '" y1="' + y(0) + '" x2="' + (W - R) + '" y2="' + y(0) + '" stroke="var(--muted)" stroke-width="1"/>' +
    '<text x="' + (L - 4) + '" y="' + (y(0) + 3) + '" font-size="9" text-anchor="end" fill="var(--muted)">0</text>' +
    '<text x="' + (L + 2) + '" y="' + (T + 8) + '" font-size="9" fill="var(--muted)">above range ↑</text>' +
    '<text x="' + (L + 2) + '" y="' + (H - B - 3) + '" font-size="9" fill="var(--muted)">below range ↓</text>';
  series.forEach((p, si) => {
    const pts = rows.map(r => r.v[p] != null ? { t: r.t, s: balanceScore(p, r.v[p], targets) } : null).filter(Boolean);
    if (pts.length < 2) return;
    s += '<path d="' + pts.map((pt, i) => (i ? "L" : "M") + x(pt.t).toFixed(1) + " " + y(pt.s).toFixed(1)).join(" ") +
      '" fill="none" stroke="' + colors[si] + '" stroke-width="2" stroke-linejoin="round"/>';
    pts.forEach(pt => { s += '<circle cx="' + x(pt.t) + '" cy="' + y(pt.s) + '" r="3.5" fill="' + colors[si] + '" stroke="var(--surface)" stroke-width="2"/>'; });
  });
  s += "</svg>";
  return s + '<div class="legend">' + series.map((p, i) =>
    '<span class="lg"><i style="background:' + colors[i] + '"></i>' + PARAM_LABELS[p] + "</span>").join("") + "</div>";
}

/* ============================================================
   HISTORY TAB — Timeline + Trends
   ============================================================ */
function eventTitle(ev) {
  switch (ev.type) {
    case "water_test": {
      const tt = ev.data.testType;
      const ctx = ev.data.context;
      const pre = ctx === "after_soak" ? "Post-soak " : ctx === "fresh_fill" ? "Fresh-fill " : "";
      return pre + (tt === "quick" ? "quick test" : tt === "retest" ? "retest" : "full water test");
    }
    case "chemical_added": return "Added " + (ev.data.productName || "chemical");
    case "shock": return "Shock completed";
    case "soak": return (ev.data.bathersLabel || ev.data.bathers) + " bathers · " + (ev.data.duration || "");
    case "filter_rinse": return "Filter rinsed";
    case "filter_clean": return "Filter deep cleaned";
    case "filter_replace": return "Filter replaced";
    case "drain_started": return "Draining started";
    case "refill": return "Refilled tub";
    case "startup_complete": return "Water setup complete";
    case "floater_change": return "Floater: " + ev.data.tablets + " tabs, opening " + ev.data.opening;
    case "note": return "Note";
    default: return ev.type;
  }
}

function eventDetail(ev) {
  if (ev.type === "water_test" && ev.data.values) {
    const parts = [];
    PARAM_ORDER.forEach(p => {
      if (ev.data.values[p] != null) parts.push((p === "pH" ? "pH" : PARAM_LABELS[p].slice(0, 2) + "") + ": " + formatValue(p, ev.data.values[p]).replace(" ppm", ""));
    });
    let s = parts.join(" · ");
    if (ev.data.observations) {
      const o = ev.data.observations;
      const flags = Object.keys(o).filter(k => !["clear", "none", "normal"].includes(o[k])).map(k => o[k]);
      if (flags.length) s += "\n" + flags.join(", ");
    }
    return s;
  }
  if (ev.type === "soak" && ev.data.heavy && ev.data.heavy.length) return ev.data.heavy.join(", ");
  return "";
}

function viewHistory() {
  let html = '<h1 class="screen-title">History</h1>' +
    '<div class="seg"><button data-act="hist-tab" data-arg="timeline" class="' + (ui.historyTab === "timeline" ? "sel" : "") + '">Timeline</button>' +
    '<button data-act="hist-tab" data-arg="trends" class="' + (ui.historyTab === "trends" ? "sel" : "") + '">Trends</button></div>';
  return html + (ui.historyTab === "trends" ? viewTrends() : viewTimeline());
}

function viewTimeline() {
  const evs = state.events.slice().reverse();
  if (evs.length === 0) return '<div class="card"><p class="tl-detail">Nothing logged yet. Run your first test or start a fresh fill.</p></div>';
  let html = '<div class="card">';
  evs.forEach(ev => {
    if (ev.type === "refill") {
      html += '<div class="tl-divider">💧 New water cycle — ' + fmtDate(ev.timestamp) + "</div>";
    }
    html += '<div class="tl-item"><span class="tl-icon">' + (EVENT_GLYPHS[ev.type] || (ev.type === "water_test" ? "🧪" : "📝")) + "</span>" +
      '<div class="tl-body"><div class="tl-when">' + fmtDate(ev.timestamp, true) + "</div>" +
      '<div class="tl-title">' + esc(eventTitle(ev)) + "</div>" +
      (eventDetail(ev) ? '<div class="tl-detail">' + esc(eventDetail(ev)) + "</div>" : "") +
      (ev.notes ? '<div class="tl-detail">📝 ' + esc(ev.notes) + "</div>" : "") + "</div></div>";
  });
  html += "</div>" +
    '<div class="card"><h3>Add a note</h3><div class="field"><input id="note-text" placeholder="e.g. water feels great today"></div>' +
    '<button class="btn" data-act="note-save">SAVE NOTE</button></div>';
  return html;
}

function trendRangeTests(range, now) {
  let tests = waterTests(state);
  if (range === "cycle") {
    const cid = currentCycleId(state);
    tests = tests.filter(t => t.waterCycleId === cid);
  } else if (range !== "all") {
    const days = { "7d": 7, "30d": 30, "90d": 90, "1y": 365 }[range];
    const cutoff = new Date(now.getTime() - days * DAY_MS).toISOString();
    tests = tests.filter(t => t.timestamp >= cutoff);
  }
  return tests;
}

function viewTrends() {
  const now = new Date();
  const ranges = [["7d", "7 days"], ["30d", "30 days"], ["90d", "90 days"], ["cycle", "Water cycle"], ["1y", "1 year"], ["all", "All"]];
  const tests = trendRangeTests(ui.trendRange, now);
  const allTests = waterTests(state);
  let html = '<div class="seg">' + ranges.map(r =>
    '<button data-act="trend-range" data-arg="' + r[0] + '" class="' + (ui.trendRange === r[0] ? "sel" : "") + '">' + r[1] + "</button>").join("") + "</div>";

  // Trend summary card (§92).
  html += trendSummaryCard(now);

  if (allTests.length < 2) {
    html += '<div class="card"><p class="tl-detail">Keep testing — trend insights will appear after several readings.</p></div>';
    return html;
  }

  // Event-marker toggle.
  html += '<div class="seg"><button data-act="toggle-markers" class="' + (state.settings.showEventMarkers ? "sel" : "") + '">' +
    (state.settings.showEventMarkers ? "✓ " : "") + "Show maintenance events</button></div>";

  // Individual raw-value charts — one per parameter, never shared axes.
  const evsInRange = state.events;
  PARAM_ORDER.forEach(p => {
    html += '<div class="card chart-card"><h3>' + PARAM_LABELS[p] +
      (ui.trendRange === "cycle" ? " — current water cycle" : "") + "</h3>" +
      svgTrendChart(p, tests, evsInRange, state.targets, now) + "</div>";
  });

  // Balance overview (normalized, secondary).
  html += '<div class="card chart-card"><h3>Balance overview — normalized</h3>' +
    '<p class="muted" style="padding:0 12px">Distance from each target range (0 = in range). Not chemical measurements.</p>' +
    svgBalanceChart(tests, state.targets) + "</div>";

  // Water-cycle summaries & comparison (§85–86).
  const cycles = waterCycles(state).filter(c => c.start || c.events.length);
  if (cycles.length) {
    html += '<div class="card"><h3>Water cycles</h3>';
    cycles.slice().reverse().forEach((c, idx) => {
      const isCurrent = idx === 0;
      const sum = cycleSummary(c, state.targets, isCurrent ? now : null);
      html += '<div style="padding:8px 0;border-bottom:1px solid var(--hairline)">' +
        '<div class="tl-title">' + (isCurrent ? "Current cycle" : "Cycle") + (c.start ? " · " + fmtDate(c.start) : " · before first recorded refill") +
        (sum.days != null ? " · " + sum.days + " days" : "") + "</div>" +
        '<div class="tl-detail">' + sum.testCount + " tests · " + sum.soakCount + " soaks · " + sum.shockCount + " shocks · " +
        sum.chemCount + " chemical additions</div>";
      const pcts = [];
      PARAM_ORDER.slice(0, 3).forEach(p => {
        const key = p === "pH" ? "pH" : p;
        if (sum.inRangePct[key] != null) pcts.push(PARAM_LABELS[p] + " in range " + sum.inRangePct[key] + "%");
      });
      if (pcts.length) html += '<div class="tl-detail">' + pcts.join(" · ") + "</div>";
      if (sum.mostOutOfRange) html += '<div class="tl-detail">Most common issue: ' + PARAM_LABELS[sum.mostOutOfRange].toLowerCase() + " out of range</div>";
      html += "</div>";
    });
    html += "</div>";
  }

  // Testing consistency (§93) — informative, never shaming.
  const tc = testingConsistency(state, now);
  html += '<div class="card"><h3>Testing consistency</h3><div class="tl-detail">Last 30 days: ' + tc.count + " tests" +
    (tc.avgIntervalDays != null ? " · average interval " + tc.avgIntervalDays + " days" +
      (tc.good ? " · ✓ good testing frequency" : "<br>Testing has been irregular, so trend conclusions are less reliable.") : "") +
    "</div></div>";
  return html;
}

function trendSummaryCard(now) {
  const cutoff = new Date(now.getTime() - 30 * DAY_MS).toISOString();
  const tests = waterTests(state).filter(t => t.timestamp >= cutoff);
  const patterns = detectPatterns(state, now);
  if (tests.length < 3 && patterns.length === 0) {
    return '<div class="card"><h3>Last 30 days</h3><p class="tl-detail">Keep testing — trend insights will appear after several readings.</p></div>';
  }
  let goods = [], warns = [];
  PARAM_ORDER.forEach(p => {
    const withP = tests.filter(t => t.data.values && t.data.values[p] != null);
    if (withP.length < 2) return;
    const out = withP.filter(t => interpretParam(p, t.data.values[p], state.targets).status !== "green");
    if (out.length === 0) goods.push(PARAM_LABELS[p] + " has stayed in range");
    else warns.push(PARAM_LABELS[p] + " was out of range on " + out.length + " of " + withP.length + " tests");
  });
  let html = '<div class="card"><h3>Last 30 days</h3>';
  goods.forEach(g => { html += '<div class="tl-detail">✓ ' + esc(g) + "</div>"; });
  warns.forEach(w => { html += '<div class="tl-detail">⚠ ' + esc(w) + "</div>"; });
  patterns.forEach(p => {
    html += '<div style="margin-top:8px"><div class="tl-title">Pattern detected: ' + esc(p.title.toLowerCase()) + "</div>" +
      '<div class="tl-detail">' + esc(p.detail) + " " + esc(p.suggestion || "") + "</div></div>";
  });
  return html + "</div>";
}

/* ============================================================

function num(id, fallback) {
  const el = document.getElementById(id);
  const v = el ? parseFloat(el.value) : NaN;
  return isNaN(v) ? fallback : v;
}
function str(id, fallback) {
  const el = document.getElementById(id);
  return el && el.value !== "" ? el.value : (fallback || "");
}

  html += '<p class="muted">' + esc(p.manufacturer) + " " + esc(p.model) + " · " + p.volumeGallons + " gal · " +

/* ============================================================
   9. IMPORT / EXPORT
   ============================================================ */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hottub-backup-" + localDateStr(new Date()) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = function () {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.events)) {
        alert2("That file doesn't look like a hot-tub backup."); return;
      }
      // Persist raw, then reload through loadState() so imports get the
      // same defensive default-merging (e.g. new interval keys) as startup.
      localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
      state = loadState();
      go("today");
    } catch (e) { alert2("Could not read that file."); }
  };
  reader.readAsText(file);
}

// Non-blocking notice (avoids native alert(), which can freeze automation).
function alert2(msg) {
  const d = document.createElement("div");
  d.className = "chart-tip";
  d.style.display = "block"; d.style.left = "16px"; d.style.right = "16px"; d.style.top = "16px"; d.style.pointerEvents = "auto";
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}

/* ============================================================
   EVENT DELEGATION — every interactive element carries data-act.
   ============================================================ */
function handleAction(act, el) {
  const arg = el.getAttribute("data-arg");
  const now = new Date();
  switch (act) {
    case "nav": go(arg); break;
    case "canuse": {
      const r = canWeUseIt(state, now);
      const cls = r.verdict === "YES" ? "banner-green" : r.verdict === "TEST_FIRST" ? "banner-gray" : "banner-red";
      const word = r.verdict === "YES" ? "YES ✓" : r.verdict === "TEST_FIRST" ? "TEST FIRST" : "NOT YET";
      document.getElementById("app").innerHTML = '<div class="screen">' +
        '<h1 class="screen-title">Can we use it?</h1>' +
        '<div class="banner ' + cls + '"><div class="b-title">' + word + '</div><div class="b-why">' + esc(r.reason) + "</div></div>" +
        (r.verdict === "TEST_FIRST" ? '<button class="btn btn-primary" data-act="test-begin" data-arg="quick">QUICK TEST NOW</button>' : "") +
        (r.verdict === "NOT_YET" && r.action ? '<button class="btn btn-primary" data-act="chem-action" data-arg="' + r.action.parameter + '">VIEW ACTION</button>' : "") +
        '<button class="btn" data-act="nav" data-arg="today">BACK</button></div>' + viewTabBar();
      break;
    }
    case "test-begin": startTest(arg === "quick" ? "quick" : "full"); break;
    case "test-step":
      if (arg === "dip") { ui.testFlow.step = "dip"; render(); }
      else if (arg === "timer") startTimer();
      else if (arg === "entry") { ui.testFlow.step = "entry"; render(); }
      break;
    case "test-cancel": ui.testFlow = null; render(); break;
    case "test-save": saveTestFlow(); break;
    case "tile": {
      const f = ui.testFlow, param = el.getAttribute("data-param"), val = parseFloat(el.getAttribute("data-val"));
      const vals = f.kit.parameters[param].values;
      if (f.between[param]) {
        if (f._betweenFirst && f._betweenFirst.param === param) {
          const a = f._betweenFirst.value, ai = vals.indexOf(a), bi = vals.indexOf(val);
          if (Math.abs(ai - bi) === 1) {
            f.values[param] = { lower: Math.min(a, val), upper: Math.max(a, val), approximate: true };
            f._betweenFirst = null;
          } else { f._betweenFirst = { param, value: val }; }
        } else { f._betweenFirst = { param, value: val }; f.values[param] = null; }
      } else {
        f.values[param] = { value: val, approximate: false };
      }
      render(); break;
    }
    case "between": {
      const f = ui.testFlow, param = el.getAttribute("data-param");
      f.between[param] = !f.between[param];
      f.values[param] = null; f._betweenFirst = null;
      render(); break;
    }
    case "ctx": ui.testFlow.context = arg; render(); break;
    case "obs": {
      const g = el.getAttribute("data-group");
      ui.testFlow.observations[g] = ui.testFlow.observations[g] === arg ? undefined : arg;
      if (ui.testFlow.observations[g] === undefined) delete ui.testFlow.observations[g];
      render(); break;
    }
    case "retest": startTest("retest", arg); break;
    case "retest-quick": startTest("quick", null, "after_soak"); break;
    case "chem-action": viewChemAction(arg); break;
    case "chem-added": {
      const param = el.getAttribute("data-param");
      const prod = findChemical(state, el.getAttribute("data-product"));
      addEvent(state, "chemical_added", { parameter: param, productId: prod ? prod.id : null,
        productName: prod ? prod.name : "chemical" }, "", now);
      saveState(state);
      startTest("retest", param, "after_chemicals");
      break;
    }
    case "soak-start": ui.soakFlow = { bathers: state.spaProfile.regularBathers, duration: "15–30 min", heavy: [] }; render(); break;
    case "soak-bathers": ui.soakFlow.bathers = arg; render(); break;
    case "soak-dur": ui.soakFlow.duration = arg; render(); break;
    case "soak-heavy": {
      const h = ui.soakFlow.heavy, i = h.indexOf(arg);
      i >= 0 ? h.splice(i, 1) : h.push(arg);
      render(); break;
    }
    case "soak-save": saveSoak(); break;
    case "soak-cancel": ui.soakFlow = null; render(); break;
    case "shock-done":
      addEvent(state, "shock", { productId: "aquarius_chlorine_free_shock" }, "", now);
      saveState(state); go("maintenance"); break;
    case "filter-rinse": addEvent(state, "filter_rinse", {}, "", now); saveState(state); render(); break;
    case "filter-clean": addEvent(state, "filter_clean", {}, "", now); saveState(state); render(); break;
    case "filter-replace": addEvent(state, "filter_replace", {}, "", now); saveState(state); render(); break;
    case "floater-save": {
      const tabs = num("fl-tabs", 3), open = num("fl-open", 4);
      state.maintenance.floater = { tablets: tabs, opening: open, loadedAt: now.toISOString() };
      addEvent(state, "floater_change", { tablets: tabs, opening: open }, "", now);
      saveState(state); render(); break;
    }
    // Fresh fill.
    case "freshfill-start": setStartupState("refill"); go("freshfill"); break;
    case "ff-circulating": ffCirculating(); break;
    case "ff-initial-test": startTest("full", null, "fresh_fill", ffAfterInitialTest); break;
    case "ff-retest": ffRetest(el.getAttribute("data-param")); break;
    case "ff-added": {
      const prod = findChemical(state, el.getAttribute("data-product"));
      addEvent(state, "chemical_added", { parameter: el.getAttribute("data-param"),
        productId: prod ? prod.id : null, productName: prod ? prod.name : "chemical" }, "", now);
      saveState(state);
      alert2("Logged. Circulate according to the chemical label, then retest.");
      render(); break;
    }
    case "ff-advance": setStartupState(arg); render(); break;
    case "ff-skip": setStartupState(arg); render(); break;      // explicit "Skip for now"
    case "ff-final-test": ffFinalTest(); break;
    case "ff-finish": ffFinish(); break;
    // Water change.
    case "wc-start": {
      addEvent(state, "drain_started", { previousWaterAgeDays: waterAgeDays(state, now) }, "", now);
      saveState(state);
      ui.waterChange = { step: 0 }; render(); break;
    }
    case "wc-next": ui.waterChange.step += 1; render(); break;
    case "wc-refill": ui.waterChange = null; setStartupState("refill"); go("freshfill"); break;
    case "wc-cancel": ui.waterChange = null; render(); break;
    // History.
    case "hist-tab": ui.historyTab = arg; render(); break;
    case "trend-range": ui.trendRange = arg; render(); break;
    case "toggle-markers": state.settings.showEventMarkers = !state.settings.showEventMarkers; saveState(state); render(); break;
    case "note-save": {
      const txt = str("note-text", "");
      if (txt) { addEvent(state, "note", {}, txt, now); saveState(state); render(); }
      break;
    }
    // Settings.
    case "set-spa":
      state.settings.spaName = str("s-name", state.settings.spaName);
      state.spaProfile.volumeGallons = num("s-gal", state.spaProfile.volumeGallons);
      state.spaProfile.volumeLitres = num("s-lit", state.spaProfile.volumeLitres);
      state.spaProfile.sanitizerSystem = str("s-san", state.spaProfile.sanitizerSystem);
      state.testKit = str("s-kit", state.testKit);
      saveState(state); alert2("Saved."); render(); break;
    case "set-targets":
      state.targets.bromine.min = num("t-br-min", 3); state.targets.bromine.max = num("t-br-max", 5);
      state.targets.pH.min = num("t-ph-min", 7.2); state.targets.pH.max = num("t-ph-max", 7.8);
      state.targets.alkalinity.min = num("t-alk-min", 80); state.targets.alkalinity.max = num("t-alk-max", 120);
      state.targets.hardness.min = num("t-hd-min", 150); state.targets.hardness.max = num("t-hd-max", 250);
      saveState(state); alert2("Saved."); render(); break;
    case "set-intervals": {
      const iv = state.maintenance.intervals;
      iv.shockDays = num("i-shock", iv.shockDays);
      iv.filterRinseDays = num("i-rinse", iv.filterRinseDays);
      iv.filterCleanDays = num("i-clean", iv.filterCleanDays);
      iv.filterReplaceMonths = Math.min(12, Math.max(9, num("i-repl", iv.filterReplaceMonths)));
      const custom = num("i-water-custom", 0);
      iv.waterChangeDays = custom > 0 ? custom : num("i-water", iv.waterChangeDays);
      iv.quickTestDays = num("i-quick", iv.quickTestDays);
      iv.fullTestDays = num("i-full", iv.fullTestDays);
      saveState(state); alert2("Saved."); render(); break;
    }
    case "chem-edit": ui.editingChem = arg; render(); break;
    case "chem-cancel": ui.editingChem = null; render(); break;
    case "chem-save": {
      const c = state.chemicalInventory.find(x => x.id === arg);
      if (c) {
        c.brand = str("c-name", c.brand || "");
        if (c.type === "placeholder" && c.brand) { c.name = c.brand; c.configured = true; }
        c.notes = str("c-notes", "");
        const dose = num("c-dose", 0), vol = num("c-vol", 0);
        c.dosing = (dose > 0 && vol > 0) ? { labelDose: dose, unit: str("c-unit", "g"),
          referenceVolume: vol, effectPerDose: num("c-ppm", 0) || null } : null;
      }
      ui.editingChem = null; saveState(state); render(); break;
    }
    case "export": exportData(); break;
    case "reset":
      if (ui._confirmReset) {
        localStorage.removeItem(STORAGE_KEY);
        state = defaultState(); ui._confirmReset = false; go("today");
      } else {
        ui._confirmReset = true;
        el.textContent = "TAP AGAIN TO CONFIRM RESET";
        setTimeout(() => { ui._confirmReset = false; if (document.body.contains(el)) el.textContent = "RESET APP"; }, 4000);
      }
      break;
  }
}

/* ============================================================
   10. APP INITIALIZATION — guarded so the chemistry engine can be
   loaded under Node (tests) without a DOM.
   ============================================================ */
if (typeof document !== "undefined" && document.getElementById) {
  state = loadState();
  document.addEventListener("click", function (e) {
    const el = e.target.closest && e.target.closest("[data-act]");
    if (el) handleAction(el.getAttribute("data-act"), el);
  });
  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "import-file" && e.target.files && e.target.files[0]) {
      importData(e.target.files[0]);
    }
  });
  // Reopening mid fresh-fill resumes the wizard instead of Today (§5, Scenario L).
  ui.route = state.startup.active ? "freshfill" : "today";
  render();
}
